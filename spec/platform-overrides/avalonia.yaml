overrides:
  - id: avalonia-control-template-native-001
    area: interaction
    component: controls
    platform: avalonia
    status: accepted
    reason: Avalonia controls use native template and automation behavior rather than Web DOM structure.
    affectedContracts:
      [component.el-button, component.el-input, component.el-select]
    visualThreshold: low
    behaviorExpectation: Native templates may differ internally, but props, events, states, keyboard behavior, and accessibility mapping must match the registry contract.
    allowedDeviation: low
    testPolicy: contract-and-accessibility
    owner: fsusui-core
    reviewAfter: 2026-12-01
    linkedIssues: [18, 23, 24, 25]
  - id: avalonia-icon-streamgeometry-001
    area: visual
    component: icon
    platform: avalonia
    status: accepted
    reason: Avalonia renders registry path data as StreamGeometry resources while Web renders SVG components from source SVG files.
    affectedContracts: [component.el-icon]
    visualThreshold: low
    behaviorExpectation: Icon identity, sizing contract, current-color behavior, and accessible hiding behavior must match the public icon contract.
    allowedDeviation: low
    testPolicy: icon-alignment-threshold
    owner: fsusui-core
    reviewAfter: 2026-12-01
    linkedIssues: [18, 24, 25, 26]
  - id: avalonia-layout-panel-measure-001
    area: visual
    component: layout-primitives
    platform: avalonia
    status: accepted
    reason: Avalonia panels measure and arrange content differently from Web flex and grid engines, especially for text baselines and scrollbar chrome.
    affectedContracts:
      [component.el-space, component.el-row, component.el-col, component.el-scrollbar]
    visualThreshold: medium
    behaviorExpectation: Gap tokens, responsive span intent, region order, keyboard scroll behavior, and accessible hidden labels must remain equivalent.
    allowedDeviation: medium
    testPolicy: layout-geometry-threshold
    owner: fsusui-core
    reviewAfter: 2026-12-01
    linkedIssues: [151]
  - id: avalonia-date-time-native-picker-001
    area: behavior
    component: date-time-pickers
    platform: avalonia
    status: accepted
    reason: Avalonia date and time controls may use native picker, calendar, and automation primitives while preserving stable public values and deterministic formatting.
    affectedContracts:
      [component.common-picker, component.el-calendar, component.el-date-picker, component.el-time-picker, component.el-time-select]
    visualThreshold: low
    behaviorExpectation: Native panel structure may differ from Web, but value binding, disabled dates and times, clear behavior, keyboard navigation, locale formatting, ranges, shortcuts, and accessibility state must remain equivalent.
    allowedDeviation: low
    testPolicy: contract-visual-and-accessibility
    owner: fsusui-core
    reviewAfter: 2026-12-01
    linkedIssues: [157]
