overrides:
  - id: avalonia-linux-window-shadow-001
    area: visual
    component: dialog
    platform: avalonia-linux
    status: accepted
    reason: Linux compositor and X11/Wayland window shadows differ from browser box-shadow rendering.
    affectedContracts: [component.el-dialog]
    visualThreshold: medium
    behaviorExpectation: Dialog modality, focus trap, dismissal, and announced name must match the public dialog contract.
    allowedDeviation: medium
    testPolicy: visual-threshold
    owner: fsusui-core
    reviewAfter: 2026-09-01
    linkedIssues: [18, 22, 24, 25]
  - id: avalonia-linux-font-rasterization-001
    area: typography
    component: text
    platform: avalonia-linux
    status: accepted
    reason: Linux fontconfig selection and Skia rasterization can differ from browser fallback metrics for the same stable font stack.
    affectedContracts: [component.el-text]
    visualThreshold: medium
    behaviorExpectation: Text content, wrapping intent, line count, ellipsis behavior, and accessible names must match the typography baseline.
    allowedDeviation: medium
    testPolicy: typography-baseline-threshold
    owner: fsusui-core
    reviewAfter: 2026-09-01
    linkedIssues: [136]
