thresholds:
  - id: visual-token-color-001
    area: visual
    component: button
    platform: all
    status: accepted
    reason: Tokenized colors should remain tight across generated Web and Avalonia outputs.
    affectedContracts: [component.el-button]
    visualThreshold: low
    behaviorExpectation: Color variance must not change state meaning, contrast intent, or token role semantics.
    allowedDeviation: low
    testPolicy: color-delta
    owner: fsusui-core
    reviewAfter: 2026-12-01
    linkedIssues: [18, 20, 24, 25]
  - id: visual-text-baseline-001
    area: visual
    component: text
    platform: all
    status: accepted
    reason: Font rasterization and baseline metrics differ across browser engines and Skia.
    affectedContracts: [component.el-text]
    visualThreshold: medium
    behaviorExpectation: Text content, line order, wrapping intent, and accessible name exposure must remain equivalent.
    allowedDeviation: medium
    testPolicy: text-baseline-threshold
    owner: fsusui-core
    reviewAfter: 2026-12-01
    linkedIssues: [18, 24, 25]
  - id: visual-markdown-source-surface-002
    area: typography
    component: markdown-editor
    platform: all
    status: accepted
    reason: Dense CJK source text rasterizes with sub-pixel glyph placement differences between browser engines and headless Skia; structure, wrapping, and token colors match.
    affectedContracts: [component.el-markdown-editor]
    visualThreshold: medium
    behaviorExpectation: Source text content, line order, monospace family, 16px/1.6 metrics, and padding must remain equivalent; glyph anti-aliasing variance is bounded by the medium level.
    allowedDeviation: medium
    testPolicy: pixelmatch-plus-lab
    owner: fsusui-core
    reviewAfter: 2026-10-01
    linkedIssues: [719]
  - id: visual-vue-parity-batch3-text-003
    area: typography
    component: all
    platform: all
    status: accepted
    reason: Element-level Web/Avalonia captures of alert, tag, progress, badge, breadcrumb, and switch contain glyph anti-aliasing and cross-rasterizer sub-pixel offsets (Chromium vs headless Skia; Noto Sans SC vs the locally licensable CJK face); layout bounds and token colors match within the low geometry and color budgets. On tiny element crops a single glyph row shift dominates the diff percentage, so the crop-level budget is registered explicitly instead of the medium level used for page-scale captures.
    affectedContracts: [component.el-alert, component.el-tag, component.el-progress, component.el-badge, component.el-breadcrumb, component.el-switch, component.el-skeleton, component.el-empty]
    visualThreshold: medium
    behaviorExpectation: Element bounds, stripe/dot/fill geometry, semantic colors, text content, and reading order must remain equivalent; glyph rasterization variance is bounded by the elementCrop level.
    allowedDeviation: elementCrop
    testPolicy: pixelmatch-plus-lab
    owner: fsusui-core
    reviewAfter: 2026-11-01
    linkedIssues: [717]
