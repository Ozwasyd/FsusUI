version: 1
scenarios:
  - id: primary-button-click
    component: button
    steps:
      - render: { variant: primary, text: Save }
      - pointerover
      - keyboard: Enter
      - assert: { emitted: press, finalState: default }
  - id: loading-button-blocks-activation
    component: button
    steps:
      - render: { variant: primary, text: Saving, loading: true }
      - pointerover
      - keyboard: Enter
      - assert: { emitted: none, finalState: loading }
  - id: disabled-button-blocks-keyboard
    component: button
    steps:
      - render: { variant: danger, text: Delete, disabled: true }
      - focus
      - keyboard: Space
      - assert: { emitted: none, finalState: disabled }
  - id: icon-button-trailing-spacing
    component: button
    steps:
      - render: { variant: default, text: Next, iconPlacement: trailing }
      - focus
      - keyboard: Enter
      - assert: { emitted: press, noOverlap: icon-label-gap }
  - id: grouped-button-borders
    component: button
    steps:
      - render:
          { variant: primary, group: [Previous, Next], disabledIndexes: [1] }
      - pointerover
      - assert: { finalState: grouped, noOverlap: shared-border-radius }
  - id: icon-only-action-accessible-name
    component: icon-button
    steps:
      - render: { icon: search, accessibleName: Search, variant: text }
      - focus
      - keyboard: Enter
      - assert: { emitted: press, accessibleName: Search, finalState: default }
  - id: link-keyboard-activation
    component: link
    steps:
      - render: { text: Docs, href: https://fsus.dev/docs }
      - focus
      - keyboard: Enter
      - assert: { emitted: press, focusTarget: link }
  - id: disabled-link-blocks-activation
    component: link
    steps:
      - render: { text: Disabled docs, disabled: true }
      - focus
      - keyboard: Space
      - assert: { emitted: none, finalState: disabled }
  - id: icon-text-link-focus-order
    component: link
    steps:
      - render: { row: [iconButton, link], accessibleName: Open details }
      - focus
      - keyboard: Tab
      - assert: { focusTarget: link, finalState: focus-visible }
  - id: text-truncation-ellipsis
    component: text
    steps:
      - render: { text: Long operational label, truncated: true }
      - assert: { finalState: truncated, noOverlap: text-ellipsis }
  - id: text-variants-baseline
    component: text
    steps:
      - render: { variants: [body, muted, strong, title, monospace] }
      - assert: { finalState: variants, noOverlap: baseline-grid }
  - id: text-input-focus
    component: input
    steps:
      - render: { placeholder: Search }
      - focus
      - keyboard: 'A'
      - assert: { value: A, finalState: focus-visible }
  - id: input-clear-affordance
    component: input
    steps:
      - render: { value: draft, clearable: true, prefix: Search, suffix: ⌘K }
      - pointer: clear
      - assert: { emitted: clear, value: '', finalState: default }
  - id: input-composition-commit
    component: input
    steps:
      - render: { value: '', ime: true }
      - keyboard: composition-n
      - keyboard: composition-commit
      - assert: { emitted: change, value: 你, finalState: default }
  - id: input-readonly-blocks-clear
    component: input
    steps:
      - render: { value: locked, clearable: true, readonly: true }
      - pointer: clear
      - assert: { emitted: none, readonly: true, value: locked }
  - id: input-disabled-blocks-clear
    component: input
    steps:
      - render: { value: locked, clearable: true, disabled: true }
      - pointer: clear
      - assert: { emitted: none, finalState: disabled, value: locked }
  - id: textarea-multiline-entry
    component: textarea
    steps:
      - render: { value: First, multiline: true }
      - focus
      - keyboard: Enter
      - keyboard: 'Second'
      - assert: { value: "First\nSecond", finalState: focus-visible }
  - id: input-number-step-and-clamp
    component: input-number
    steps:
      - render: { value: 4, min: 0, max: 10, step: 2 }
      - keyboard: ArrowUp
      - keyboard: ArrowUp
      - keyboard: ArrowUp
      - keyboard: ArrowUp
      - assert: { value: 10, emitted: change, finalState: default }
  - id: input-number-min-clamp
    component: input-number
    steps:
      - render: { value: 1, min: 0, max: 10, step: 2 }
      - keyboard: ArrowDown
      - assert: { value: 0, emitted: change, finalState: default }
  - id: checkbox-toggle
    component: checkbox
    steps:
      - render: { checked: false, text: Accept }
      - focus
      - keyboard: Space
      - assert: { checked: true }
  - id: dialog-keyboard-containment
    component: dialog
    steps:
      - render: { modal: true, title: Confirm }
      - focus
      - keyboard: Tab
      - keyboard: Escape
      - assert: { finalState: closed }
  - id: tabs-arrow-navigation
    component: tabs
    steps:
      - render: { selectedKey: overview }
      - focus
      - keyboard: ArrowRight
      - assert: { selectedKey: next }
  - id: menu-item-activation
    component: menu
    steps:
      - render: { selectedKey: dashboard }
      - focus
      - keyboard: ArrowDown
      - keyboard: Enter
      - assert: { emitted: select }
