name: Markdown UTF-8 worker validation (diagnostic only)

on:
  push:
    branches:
      - codex/fsusui-markdown-utf8-validation

permissions:
  contents: read

env:
  PRODUCT_SHA: 85ac42755432f06aa6b8fbdff751a98b29b8dad6
  PRODUCT_TREE: 302622aed21489a1d04e468a1cc2fa4815696ac8
  PATCH_SHA256: f6daf9103060487bf180402fc1cc2f74237d9a67a79940e0d3d9fd3f09faf0df

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - name: Verify exact source and stage the supplied two-file patch
        working-directory: product
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/markdown-utf8-evidence"
          patch="$GITHUB_WORKSPACE/controller/.github/diagnostics/markdown-utf8/product.patch"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch" | sha256sum --check -
          git apply --index --check "$patch"
          git apply --index "$patch"
          paths="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            vue/packages/components/markdown-renderer/__tests__/markdown-renderer.test.tsx \
            vue/packages/components/markdown-renderer/src/markdown-renderer.vue)"
          test "$paths" = "$expected"
          git diff --cached --check
          {
            printf 'controller=%s\nproduct=%s\noriginalTree=%s\nproductPatch=%s\nstagedTree=%s\n' \
              "$GITHUB_SHA" "$PRODUCT_SHA" "$PRODUCT_TREE" "$PATCH_SHA256" "$(git write-tree)"
            git ls-files --stage -- \
              vue/packages/components/markdown-renderer/__tests__/markdown-renderer.test.tsx \
              vue/packages/components/markdown-renderer/src/markdown-renderer.vue
          } > "$evidence/provenance.txt"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: pnpm
          cache-dependency-path: product/pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - name: Restore the exact locked toolchain and official test artifacts
        working-directory: product
        timeout-minutes: 12
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.5
          test "$(pnpm --version)" = 10.33.0
          pnpm install --frozen-lockfile
          pnpm run prepare:test-artifacts
          pnpm run check:test-artifacts-ready
      - name: Run official Markdown renderer Vitest suite
        working-directory: product
        timeout-minutes: 4
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/markdown-utf8-evidence/vitest.json"
          pnpm run _test:run vue/packages/components/markdown-renderer/__tests__/markdown-renderer.test.tsx \
            --reporter=default --reporter=json --outputFile.json="$report"
          node --input-type=module - "$report" <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          assert.equal(report.success, true)
          assert.equal(report.testResults.length, 1)
          const tests = report.testResults[0].assertionResults.filter(
            ({ fullName }) => fullName.includes('validates UTF-8 lengths on a non-ASCII worker result'),
          )
          assert.equal(tests.length, 3)
          for (const field of ['null', 'sourceLength', 'normalizedSourceLength']) {
            const results = tests.filter(({ fullName }) => fullName.endsWith(`(wrong field: ${field})`))
            assert.equal(results.length, 1)
            assert.equal(results[0].status, 'passed')
          }
          JS
      - name: Install and verify pinned Chromium
        working-directory: product
        timeout-minutes: 4
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          node scripts/pin-render-browser.mjs "$GITHUB_WORKSPACE/markdown-utf8-evidence/browser-selection.json"
      - name: Exercise real Chinese cold fixture in Chromium
        working-directory: product
        timeout-minutes: 4
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/markdown-utf8-evidence"
          setsid pnpm -C vue/packages/demo-app exec vite --host 127.0.0.1 --port 5173 --strictPort > "$evidence/vite.log" 2>&1 &
          server=$!
          cleanup() { kill -TERM -- "-$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=false
          for _ in {1..30}; do
            kill -0 "$server"
            if curl --silent --fail --max-time 1 http://127.0.0.1:5173/ >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          timeout --kill-after=5s 165s node \
            "$GITHUB_WORKSPACE/controller/.github/diagnostics/markdown-utf8/chrome.mjs" "$PWD" \
            "$evidence/chrome.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markdown-utf8-validation
          path: markdown-utf8-evidence
          retention-days: 7
          if-no-files-found: error
