name: FsusBlog candidate consumer gate

on:
  workflow_call:
    inputs:
      candidate-artifact-name:
        description: Immutable FsusUI candidate artifact produced by release quality.
        required: true
        type: string
      candidate-manifest-name:
        description: Manifest filename adjacent to the immutable candidate tarball.
        required: true
        type: string
      candidate-digest:
        description: Expected SHA-256 from the release-quality build-package job.
        required: true
        type: string
      quality-candidate-digest:
        description: Candidate SHA-256 exported by the release-quality job.
        required: true
        type: string
      matrix-artifact-name:
        description: Three-profile consumer matrix artifact from release quality.
        required: true
        type: string
      target-repository:
        description: Repository containing the formal FsusUI candidate consumer entry.
        default: Ozwasyd/FsusBlog
        required: false
        type: string
    secrets:
      FSUS_CROSS_REPO_APP_PRIVATE_KEY:
        required: true
    outputs:
      fsusblog-default-branch:
        description: FsusBlog default branch resolved once from repository metadata.
        value: ${{ jobs.consumer.outputs.default-branch }}
      fsusblog-commit-sha:
        description: Full immutable FsusBlog commit used for every consumer step.
        value: ${{ jobs.consumer.outputs.commit-sha }}
      candidate-binding-sha256:
        description: Digest of the same-candidate cross-repository binding.
        value: ${{ jobs.consumer.outputs.candidate-binding-sha256 }}

permissions:
  contents: read

jobs:
  consumer:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      default-branch: ${{ steps.resolve.outputs.default_branch }}
      commit-sha: ${{ steps.resolve.outputs.commit_sha }}
      candidate-binding-sha256: ${{ steps.binding-before.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: fsusui
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Reject untrusted or non-canonical invocation
        working-directory: fsusui
        run: |
          test "$GITHUB_EVENT_NAME" = "push"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) exit 1 ;; esac
          test '${{ inputs.target-repository }}' = 'Ozwasyd/FsusBlog'
          test '${{ inputs.candidate-artifact-name }}' = 'fsusui-npm-candidate'
          test '${{ inputs.candidate-manifest-name }}' = 'fsusui-npm-candidate.manifest.json'
          test '${{ inputs.matrix-artifact-name }}' = 'consumer-matrix-release'
          printf '%s' '${{ inputs.candidate-digest }}' | grep -Eq '^[a-f0-9]{64}$'
          printf '%s' '${{ inputs.quality-candidate-digest }}' | grep -Eq '^[a-f0-9]{64}$'
      - name: Verify read-only App installation contract
        working-directory: fsusui
        env:
          FSUS_CROSS_REPO_APP_ID: ${{ vars.FSUS_CROSS_REPO_APP_ID }}
          FSUS_CROSS_REPO_APP_PRIVATE_KEY: ${{ secrets.FSUS_CROSS_REPO_APP_PRIVATE_KEY }}
        run: |
          node scripts/cross-repo-app-verifier.mjs \
            --trusted-context true \
            --output ../cross-repo-app-evidence.json
      - name: Mint FsusBlog read-only token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FSUS_CROSS_REPO_APP_ID }}
          private-key: ${{ secrets.FSUS_CROSS_REPO_APP_PRIVATE_KEY }}
          owner: Ozwasyd
          repositories: FsusBlog
          permission-contents: read
      - name: Resolve and freeze FsusBlog default-branch head
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPOSITORY: ${{ inputs.target-repository }}
        run: |
          default_branch="$(gh api "repos/$TARGET_REPOSITORY" --jq '.default_branch')"
          test -n "$default_branch"
          commit_sha="$(gh api "repos/$TARGET_REPOSITORY/commits/$default_branch" --jq '.sha')"
          printf '%s' "$commit_sha" | grep -Eq '^[a-f0-9]{40}$'
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate-artifact-name }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.matrix-artifact-name }}
          path: consumer-matrix
      - name: Require the declared immutable candidate files
        env:
          CANDIDATE_MANIFEST_NAME: ${{ inputs.candidate-manifest-name }}
        run: |
          test -f candidate/fsusui-npm-candidate.tgz
          test -f "candidate/$CANDIDATE_MANIFEST_NAME"
          test -f consumer-matrix/receipts/matrix-summary.json
      - name: Install FsusUI verification dependencies
        working-directory: fsusui
        run: pnpm install --frozen-lockfile
      - name: Bind candidate, manifest, quality output, and consumer matrix
        id: binding-before
        run: |
          digest="$(node fsusui/scripts/cross-repo-candidate-binding.mjs \
            --repo-root fsusui \
            --candidate candidate/fsusui-npm-candidate.tgz \
            --candidate-manifest candidate/fsusui-npm-candidate.manifest.json \
            --matrix-directory consumer-matrix/receipts \
            --candidate-digest '${{ inputs.candidate-digest }}' \
            --quality-candidate-digest '${{ inputs.quality-candidate-digest }}' \
            --source-commit "$GITHUB_SHA" \
            --release-tag "$GITHUB_REF_NAME" \
            --output candidate-binding-before.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Checkout the frozen FsusBlog commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repository }}
          ref: ${{ steps.resolve.outputs.commit_sha }}
          token: ${{ steps.app-token.outputs.token }}
          path: fsusblog
          persist-credentials: false
      - name: Verify pinned checkout and clean precondition
        working-directory: fsusblog
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain)"
          node -e "const p=require('./src/frontend/package.json'); if (!p.scripts?.['verify:fsusui-candidate']) process.exit(1)"
      - name: Record exact consumer toolchain
        working-directory: fsusblog
        run: |
          node --version
          npm --version
          node -e "const p=require('./src/frontend/package.json'); for (const n of ['vue','vite','typescript','vue-tsc']) { const v=p.dependencies?.[n] ?? p.devDependencies?.[n]; if (!v) process.exit(1); console.log(n + '=' + v) }"
      - name: Run the formal FsusBlog candidate consumer entry
        working-directory: fsusblog
        env:
          CANDIDATE_PATH: ${{ github.workspace }}/candidate/fsusui-npm-candidate.tgz
        run: |
          test "${CANDIDATE_PATH#/}" != "$CANDIDATE_PATH"
          npm --prefix src/frontend run verify:fsusui-candidate -- --tarball "$CANDIDATE_PATH"
      - name: Verify pinned checkout and clean postcondition
        if: always()
        working-directory: fsusblog
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Reverify immutable candidate after FsusBlog consumption
        if: always()
        run: |
          digest="$(node fsusui/scripts/cross-repo-candidate-binding.mjs \
            --repo-root fsusui \
            --candidate candidate/fsusui-npm-candidate.tgz \
            --candidate-manifest candidate/fsusui-npm-candidate.manifest.json \
            --matrix-directory consumer-matrix/receipts \
            --candidate-digest '${{ inputs.candidate-digest }}' \
            --quality-candidate-digest '${{ inputs.quality-candidate-digest }}' \
            --source-commit "$GITHUB_SHA" \
            --release-tag "$GITHUB_REF_NAME" \
            --output candidate-binding-after.json)"
          test "$digest" = '${{ steps.binding-before.outputs.digest }}'
          cmp candidate-binding-before.json candidate-binding-after.json
      - name: Upload sanitized App evidence
        uses: actions/upload-artifact@v4
        with:
          name: fsus-cross-repo-app-evidence
          path: cross-repo-app-evidence.json
          if-no-files-found: error
          retention-days: 7
