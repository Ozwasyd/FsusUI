name: CheckTag Chromium 147 evidence
on:
  push:
    branches:
      - codex/fsusui-1085-chromium147-sandbox-probe

permissions:
  contents: read

jobs:
  check-tag-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 292a6ca6d7659b18574ac1f3ae7a8f66494af7d4
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact PR source
        run: test "$(git rev-parse HEAD)" = "292a6ca6d7659b18574ac1f3ae7a8f66494af7d4"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Pin Chromium for native screen-reader evidence
        run: node scripts/pin-render-browser.mjs .tmp/conformance-browser-selection.json
      - name: Install native screen-reader prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y orca at-spi2-core python3-pyatspi dbus-x11
      - name: Build exact candidate demo
        run: pnpm run build:demo
      - name: Capture original Avalonia and Web conformance evidence
        env:
          GITHUB_SHA: 292a6ca6d7659b18574ac1f3ae7a8f66494af7d4
        run: |
          xvfb-run -a dbus-run-session -- bash -e -o pipefail -c '
            pnpm run conformance:v2:avalonia
            pnpm run a11y:runtime
            node scripts/native-screen-reader-harness.mjs --skip-build --out .tmp/conformance-v2/web-a11y
          '
      - name: Upload raw evidence, not acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-292a6ca-checktag-chromium147-raw
          path: |
            .tmp/conformance-v2
            .tmp/conformance-browser-selection.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
