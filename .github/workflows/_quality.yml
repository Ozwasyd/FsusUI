name: Reusable Quality Gates

on:
  workflow_call:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:consumer-contract
      - run: pnpm run check:npm-dist-tag

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tokens:check
      - run: pnpm run tokens:lint

  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run icons:check
      - run: pnpm run icons:lint

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run conformance

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run governance:check

  dotnet:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dotnet:verify

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('packages/icons-vue/package.json', 'packages/icons-vue/src/**', 'packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('packages/wasm/package.json', 'packages/wasm/build.config.ts', 'packages/wasm/**/*.ts', 'packages/wasm/**/*.cpp', 'packages/wasm/**/*.hpp', 'packages/wasm/**/*.h', 'packages/wasm/**/CMakeLists.txt', 'packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm run prepare:test-artifacts
      - name: Pack unit test artifacts
        run: |
          tar -czf unit-test-artifacts.tgz packages/icons-vue/dist packages/wasm/dist
          sha256sum unit-test-artifacts.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-artifacts
          path: unit-test-artifacts.tgz
          retention-days: 1

  unit:
    needs: unit-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: unit-test-artifacts
          path: .unit-artifacts
      - name: Unpack unit test artifacts
        run: |
          sha256sum .unit-artifacts/unit-test-artifacts.tgz
          tar -xzf .unit-artifacts/unit-test-artifacts.tgz
      - run: pnpm run check:test-artifacts-ready
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('packages/icons-vue/package.json', 'packages/icons-vue/src/**', 'packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('packages/wasm/package.json', 'packages/wasm/build.config.ts', 'packages/wasm/**/*.ts', 'packages/wasm/**/*.cpp', 'packages/wasm/**/*.hpp', 'packages/wasm/**/*.h', 'packages/wasm/**/CMakeLists.txt', 'packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage

  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('packages/icons-vue/package.json', 'packages/icons-vue/src/**', 'packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('packages/wasm/package.json', 'packages/wasm/build.config.ts', 'packages/wasm/**/*.ts', 'packages/wasm/**/*.cpp', 'packages/wasm/**/*.hpp', 'packages/wasm/**/*.h', 'packages/wasm/**/CMakeLists.txt', 'packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm run build:npm-package
      - name: Pack npm package dist artifact
        run: |
          tar -czf fsusui-npm-package-dist.tgz dist/element-plus
          sha256sum fsusui-npm-package-dist.tgz | tee fsusui-npm-package-dist.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fsusui-npm-package-dist
          path: |
            fsusui-npm-package-dist.tgz
            fsusui-npm-package-dist.sha256
          retention-days: 1

  consumer-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - contract
      - build-package
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: fsusui-npm-package-dist
          path: .npm-package-artifact
      - name: Restore npm package dist artifact
        run: |
          (cd .npm-package-artifact && sha256sum -c fsusui-npm-package-dist.sha256)
          tar -xzf .npm-package-artifact/fsusui-npm-package-dist.tgz
          test -f dist/element-plus/package.json
          echo "fsusui-npm-package-dist restored from build-package artifact"
      - run: pnpm run build:package-smoke
      - run: pnpm test:consumer-install

  build-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('packages/icons-vue/package.json', 'packages/icons-vue/src/**', 'packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('packages/wasm/package.json', 'packages/wasm/build.config.ts', 'packages/wasm/**/*.ts', 'packages/wasm/**/*.cpp', 'packages/wasm/**/*.hpp', 'packages/wasm/**/*.h', 'packages/wasm/**/CMakeLists.txt', 'packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm run build:demo

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-light, mobile-light, desktop-dark, mobile-dark]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('packages/icons-vue/package.json', 'packages/icons-vue/src/**', 'packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('packages/wasm/package.json', 'packages/wasm/build.config.ts', 'packages/wasm/**/*.ts', 'packages/wasm/**/*.cpp', 'packages/wasm/**/*.hpp', 'packages/wasm/**/*.h', 'packages/wasm/**/CMakeLists.txt', 'packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
