name: Reusable Quality Gates

on:
  workflow_call:
    inputs:
      group:
        description: Quality group to run.
        required: false
        type: string
        default: main
      release_tag:
        description: Expected v-prefixed package version for release identity binding.
        required: false
        type: string
        default: ''
    outputs:
      npm-candidate-digest:
        description: SHA-256 of the immutable npm candidate tested by quality.
        value: ${{ jobs.build-package.outputs.candidate-digest }}
      release-readiness-digest:
        description: SHA-256 of the release aggregator evidence bound to SHA, tag, and package.
        value: ${{ jobs.release-readiness.outputs.evidence-digest }}

jobs:
  real-render-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ensure:wasm
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run real-render matrix
        run: pnpm perf:render -- --profile ${{ inputs.group == 'main' && 'quick' || 'full' }} --output .tmp/performance/current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-render-performance-${{ inputs.group }}
          path: .tmp/performance/current
          retention-days: 30
      - name: Record performance leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: real-render-performance
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          dimensions: profile=${{ inputs.group == 'main' && 'quick' || 'full' }}
          artifacts: real-render-performance=.tmp/performance/current

  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run contract checks
        run: |
          pnpm run check:consumer-contract
          pnpm run check:npm-dist-tag
      - name: Run lint
        run: pnpm lint
      - name: Run token checks
        run: |
          pnpm run tokens:check
          pnpm run tokens:lint
      - name: Run icon checks
        run: |
          pnpm run icons:check
          pnpm run icons:lint
      - name: Run conformance
        run: pnpm run conformance
      - name: Run governance
        run: pnpm run governance:check
      - name: Run accessibility contract
        run: pnpm run a11y:check
      - name: Record static quality leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: static-quality
          group: ${{ inputs.group }}
          status: ${{ job.status }}

  dotnet-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - name: Restore .NET build output cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            dotnet/**/obj
          key: ${{ runner.os }}-${{ runner.arch }}-fsusui-dotnet-sdk-${{ hashFiles('dotnet/global.json') }}-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/**/*.props', 'dotnet/**/*.targets', 'dotnet/**/*.slnx', 'dotnet/**/packages.lock.json', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fsusui-dotnet-sdk-${{ hashFiles('dotnet/global.json') }}-
      - name: Run platform-owned restore, build, tests, and smoke
        run: node scripts/dotnet-platform-verify.mjs --output dotnet/artifacts/platform/${{ matrix.platform }}/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: dotnet-platform-${{ matrix.platform }}
          path: dotnet/artifacts/platform/${{ matrix.platform }}
          retention-days: 7
      - name: Record .NET platform leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: dotnet-platform
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          dimensions: platform=${{ matrix.platform }}
          artifacts: dotnet-platform=dotnet/artifacts/platform/${{ matrix.platform }}
          artifact-suffix: ${{ matrix.platform }}

  dotnet-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate-digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - name: Restore canonical .NET package cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            dotnet/**/obj
          key: ${{ runner.os }}-${{ runner.arch }}-fsusui-dotnet-package-sdk-${{ hashFiles('dotnet/global.json') }}-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/**/*.props', 'dotnet/**/*.targets', 'dotnet/**/*.slnx', 'dotnet/**/packages.lock.json', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fsusui-dotnet-package-sdk-${{ hashFiles('dotnet/global.json') }}-
      - name: Build and verify the unique NuGet candidate
        id: candidate
        run: |
          node scripts/dotnet-package-verify.mjs
          echo "digest=$(node -p \"require('./dotnet/artifacts/package/manifest.json').candidateSha256\")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-nuget-candidate
          path: |
            dotnet/artifacts/nuget
            dotnet/artifacts/package/manifest.json
          retention-days: 7
      - name: Record unique NuGet candidate leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: dotnet-package
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          artifacts: nuget-candidate=dotnet/artifacts

  avalonia-aot-linux:
    needs: dotnet-package
    uses: ./.github/workflows/_avalonia-aot-leaf.yml
    with:
      group: ${{ inputs.group }}
      candidate-artifact: dotnet-nuget-candidate
      candidate-digest: ${{ needs.dotnet-package.outputs.candidate-digest }}
      commit-sha: ${{ github.sha }}
      rid: linux-x64

  avalonia-aot:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - dotnet-package
      - avalonia-aot-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: avalonia-aot-leaf-linux-x64
          path: .avalonia-aot-leaves
      - name: Aggregate required and optional Native AOT leaves
        run: >-
          node scripts/avalonia-aot-native.mjs aggregate
          --leaf-dir .avalonia-aot-leaves
          --out .avalonia-aot-readiness/manifest.json
          --commit-sha "$GITHUB_SHA"
          --candidate-digest '${{ needs.dotnet-package.outputs.candidate-digest }}'
      - uses: actions/upload-artifact@v4
        with:
          name: avalonia-aot-readiness
          path: .avalonia-aot-readiness
          retention-days: 7
      - name: Record Avalonia Native AOT readiness leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: avalonia-aot
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          artifacts: avalonia-aot=.avalonia-aot-readiness

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Restore TypeScript typecheck cache
        id: typecheck-cache
        uses: actions/cache@v4
        with:
          path: .tmp/typecheck-cache
          key: ${{ runner.os }}-fsusui-typecheck-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'vue/tsconfig*.json', 'vue/packages/**/*.ts', 'vue/packages/**/*.tsx', 'vue/packages/**/*.vue', 'vue/packages/**/*.json', 'vue/internal/**/*.ts', 'vue/internal/**/*.json', 'vue/typings/**/*.d.ts', 'scripts/run-typecheck.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-typecheck-
      - name: Log TypeScript typecheck cache status
        run: |
          echo "typecheck-cache-hit=${{ steps.typecheck-cache.outputs.cache-hit }}"
          echo "cache-hit=${{ steps.typecheck-cache.outputs.cache-hit }}"
          echo "cache-primary-key=${{ steps.typecheck-cache.outputs.cache-primary-key }}"
      - run: pnpm typecheck
      - name: Record typecheck leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: typecheck
          group: ${{ inputs.group }}
          status: ${{ job.status }}

  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit-matrix: ${{ steps.plan.outputs.unit-matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create repository capacity plan
        id: plan
        run: node ./scripts/ci-capacity.mjs --dry-run --github-output="$GITHUB_OUTPUT"

  unit-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('vue/packages/icons-vue/package.json', 'vue/packages/icons-vue/src/**', 'vue/packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm run prepare:test-artifacts
      - name: Pack unit test artifacts
        run: |
          tar -czf unit-test-artifacts.tgz vue/packages/icons-vue/dist vue/packages/wasm/dist
          sha256sum unit-test-artifacts.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-artifacts
          path: unit-test-artifacts.tgz
          retention-days: 1

  unit:
    needs:
      - capacity
      - unit-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.capacity.outputs.unit-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: unit-test-artifacts
          path: .unit-artifacts
      - name: Unpack unit test artifacts
        run: |
          sha256sum .unit-artifacts/unit-test-artifacts.tgz
          tar -xzf .unit-artifacts/unit-test-artifacts.tgz
      - run: pnpm run check:test-artifacts-ready
      - name: Run capacity-planned Unit shard
        env:
          FSUS_VITEST_WORKERS: ${{ matrix.workers }}
        run: node ./scripts/with-node-heap.mjs pnpm exec vitest run --config vue/vitest.config.ts --shard=${{ matrix.shard }}
      - name: Record Unit shard leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: unit
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          dimensions: shard=${{ matrix.shard }}
          artifact-suffix: ${{ strategy.job-index }}

  coverage-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      shard-count: ${{ steps.plan.outputs.shard_count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: plan
        name: Plan coverage from effective capacity and workload
        run: node scripts/coverage-plan.mjs --dry-run --github-output="$GITHUB_OUTPUT"

  coverage-single:
    if: needs.coverage-plan.outputs.mode == 'single'
    needs: coverage-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('vue/packages/icons-vue/package.json', 'vue/packages/icons-vue/src/**', 'vue/packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - name: Run coverage
        env:
          FSUSUI_COVERAGE_SHARDS: 1
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage

  coverage-shard:
    if: needs.coverage-plan.outputs.mode == 'sharded'
    needs: coverage-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.coverage-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        uses: actions/cache@v4
        with:
          path: vue/packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('vue/packages/icons-vue/package.json', 'vue/packages/icons-vue/src/**', 'vue/packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - run: pnpm run prepare:test-artifacts
      - name: Run one coverage shard
        env:
          FSUSUI_COVERAGE_SHARDS: ${{ matrix.total }}
          FSUSUI_COVERAGE_WORKERS: ${{ matrix.workers }}
          FSUSUI_COVERAGE_SHARD_INDEX: ${{ matrix.index }}
          FSUSUI_COVERAGE_SHARD_TOTAL: ${{ matrix.total }}
        run: pnpm coverage:run
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.index }}-${{ matrix.total }}
          path: .tmp/coverage-run
          retention-days: 1

  coverage-merge:
    if: needs.coverage-plan.outputs.mode == 'sharded'
    needs:
      - coverage-plan
      - coverage-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: .tmp/coverage-run
          merge-multiple: true
      - name: Validate shards, merge, and apply final thresholds once
        run: pnpm coverage:merge .tmp/coverage-run
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage

  coverage:
    if: always()
    needs:
      - coverage-plan
      - coverage-single
      - coverage-shard
      - coverage-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require the selected complete coverage path
        env:
          PLAN_RESULT: ${{ needs.coverage-plan.result }}
          MODE: ${{ needs.coverage-plan.outputs.mode }}
          SINGLE_RESULT: ${{ needs.coverage-single.result }}
          SHARD_RESULT: ${{ needs.coverage-shard.result }}
          MERGE_RESULT: ${{ needs.coverage-merge.result }}
        run: |
          test "$PLAN_RESULT" = success
          if test "$MODE" = single; then
            test "$SINGLE_RESULT" = success
          else
            test "$SHARD_RESULT" = success
            test "$MERGE_RESULT" = success
          fi
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: .coverage-evidence
      - name: Record final coverage leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: coverage
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          dimensions: mode=${{ needs.coverage-plan.outputs.mode }}
          artifacts: coverage-report=.coverage-evidence

  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      candidate-digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Use release npm toolchain
        run: npm install -g npm@^11.5.1
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('vue/packages/icons-vue/package.json', 'vue/packages/icons-vue/src/**', 'vue/packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - name: Build immutable npm candidate
        id: candidate
        run: |
          pnpm run package:candidate:build
          digest="$(node -p "require('./dist/npm-candidate/fsusui-npm-candidate.manifest.json').artifact.sha256")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: fsusui-npm-candidate
          path: |
            dist/npm-candidate/fsusui-npm-candidate.tgz
            dist/npm-candidate/fsusui-npm-candidate.sha256
            dist/npm-candidate/fsusui-npm-candidate.manifest.json
          retention-days: 1
      - name: Record npm candidate leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: build-package
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          artifacts: npm-candidate=dist/npm-candidate

  consumer-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - static-quality
      - build-package
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Use release npm toolchain
        run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: fsusui-npm-candidate
          path: .npm-candidate
      - name: Verify immutable npm candidate and package smoke
        run: |
          pnpm run package:candidate:verify -- --tarball .npm-candidate/fsusui-npm-candidate.tgz
          digest="$(node -p "require('./.npm-candidate/fsusui-npm-candidate.manifest.json').artifact.sha256")"
          test "${digest}" = "${{ needs.build-package.outputs.candidate-digest }}"
      - name: Run cold consumer install against candidate
        run: pnpm test:consumer-install -- .npm-candidate/fsusui-npm-candidate.tgz
      - name: Record consumer install leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: consumer-install
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          artifacts: npm-candidate=.npm-candidate

  build-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('vue/packages/icons-vue/package.json', 'vue/packages/icons-vue/src/**', 'vue/packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm run build:demo
      - name: Record demo build leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: build-demo
          group: ${{ inputs.group }}
          status: ${{ job.status }}

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FSUS_VISUAL_EVIDENCE: ${{ inputs.group == 'release' && '1' || '0' }}
      FSUS_VISUAL_SUITE_MODE: auto
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: .tmp/playwright-browsers
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('vue/packages/icons-vue/package.json', 'vue/packages/icons-vue/src/**', 'vue/packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Probe visual capacity
        run: pnpm visual:capacity
      - name: Print visual execution plan
        run: pnpm test:visual:plan
      - name: Run visual suites
        run: |
          if [ "${{ inputs.group }}" = "release" ]; then
            pnpm test:visual:evidence
          else
            pnpm test:visual:full
          fi
      - uses: actions/upload-artifact@v4
        if: failure() && inputs.group != 'release'
        continue-on-error: true
        with:
          name: avalonia-screenshots-${{ inputs.group }}
          path: |
            playwright-report/profile-*
            vue/test-results/profile-*
      - uses: actions/upload-artifact@v4
        if: always() && inputs.group == 'release'
        continue-on-error: true
        with:
          name: avalonia-screenshots-${{ inputs.group }}
          path: |
            playwright-report/profile-*
            vue/test-results/profile-*
            .tmp/visual-evidence/manifest.json
            .tmp/visual-runtime/manifest.json
            screenshots
      - name: Record visual leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: visual
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          dimensions: profile=${{ inputs.group == 'release' && 'evidence' || 'full' }}

  stable-readiness:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - static-quality
      - dotnet-platform
      - dotnet-package
      - avalonia-aot
      - typecheck
      - unit
      - coverage
      - build-package
      - consumer-install
      - build-demo
      - visual
      - real-render-performance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: readiness-manifest-*
          path: .readiness
          merge-multiple: true
      - name: Aggregate stable leaf evidence
        run: |
          node scripts/ci-readiness.mjs check \
            --root .readiness \
            --profile main \
            --workflow-group '${{ inputs.group }}' \
            --playwright-group ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'pr' || 'main' }} \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence .readiness/evidence/stable.json
      - name: Pack stable evidence
        run: |
          tar -czf avalonia-stable-evidence.tgz .readiness docs/releases spec/components tests/conformance
          sha256sum avalonia-stable-evidence.tgz | tee avalonia-stable-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: avalonia-stable-evidence
          path: |
            avalonia-stable-evidence.tgz
            avalonia-stable-evidence.sha256
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: avalonia-generated-artifacts
          path: |
            generated
            tests/conformance/**/artifacts
            docs/releases
          retention-days: 7

  nightly-readiness:
    if: always() && inputs.group == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - stable-readiness
      - real-render-performance
      - static-quality
      - dotnet-platform
      - dotnet-package
      - avalonia-aot
      - typecheck
      - unit
      - coverage
      - build-package
      - consumer-install
      - build-demo
      - visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: readiness-manifest-*
          path: .readiness
          merge-multiple: true
      - name: Aggregate nightly leaf evidence
        run: |
          node scripts/ci-readiness.mjs check \
            --root .readiness \
            --profile nightly \
            --workflow-group nightly \
            --playwright-group nightly \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence .readiness/evidence/nightly.json
      - name: Pack nightly evidence
        run: |
          tar -czf avalonia-nightly-evidence.tgz .readiness docs/releases spec/ci
          sha256sum avalonia-nightly-evidence.tgz | tee avalonia-nightly-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: avalonia-nightly-evidence
          path: |
            avalonia-nightly-evidence.tgz
            avalonia-nightly-evidence.sha256
          retention-days: 7

  release-readiness:
    if: always() && inputs.group == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      evidence-digest: ${{ steps.release-evidence.outputs.digest }}
    needs:
      - stable-readiness
      - real-render-performance
      - static-quality
      - dotnet-platform
      - dotnet-package
      - avalonia-aot
      - typecheck
      - unit
      - coverage
      - build-package
      - consumer-install
      - build-demo
      - visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: readiness-manifest-*
          path: .readiness
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: fsusui-npm-candidate
          path: .npm-candidate
      - name: Aggregate release leaf evidence
        id: release-evidence
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          release_tag="$RELEASE_TAG_INPUT"
          if [ -z "$release_tag" ]; then
            release_tag="v$(node -p "require('./vue/packages/element-plus/package.json').version")"
          fi
          node scripts/ci-readiness.mjs check \
            --root .readiness \
            --profile release \
            --workflow-group release \
            --playwright-group release \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release-tag "$release_tag" \
            --candidate-manifest .npm-candidate/fsusui-npm-candidate.manifest.json \
            --evidence .readiness/evidence/release.json
          digest="$(sha256sum .readiness/evidence/release.json | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Pack release evidence
        run: |
          tar -czf avalonia-release-evidence.tgz .readiness docs/releases spec/ci
          sha256sum avalonia-release-evidence.tgz | tee avalonia-release-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: avalonia-release-evidence
          path: |
            avalonia-release-evidence.tgz
            avalonia-release-evidence.sha256
          retention-days: 7
