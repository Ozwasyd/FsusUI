name: Reusable Quality Gates

on:
  workflow_call:
    inputs:
      group:
        description: Quality group to run.
        required: false
        type: string
        default: main
      release_tag:
        description: Expected v-prefixed package version for release identity binding.
        required: false
        type: string
        default: ''
    outputs:
      npm-candidate-digest:
        description: SHA-256 of the immutable npm candidate tested by quality.
        value: ${{ jobs.build-package.outputs.candidate-digest }}

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - run: pnpm install --frozen-lockfile
      - name: Run contract, dependency, and design checks
        run: |
          pnpm run check:consumer-contract
          pnpm run check:npm-dist-tag
          pnpm run check:documentation-architecture
          pnpm run deps:check
          pnpm run deps:authority:check
          pnpm run check:ux-semantics
          pnpm run check:foundation-style-boundary
          pnpm run check:design-source-drift
          pnpm run typography:check
          pnpm run a11y:check
          pnpm run conformance:tokens
          pnpm run conformance:contracts
          pnpm run avalonia:baseline:check
          pnpm run avalonia:semantic:check
          pnpm run contract-v2:check
          pnpm run test:contract-v2
          pnpm run conformance:v2:vue-public
          pnpm run check:visual-orchestration
          pnpm run check:visual-variant-ownership
          pnpm run check:dotnet-matrix
          pnpm run governance:cross-platform
          pnpm run test:release-channel
          pnpm run check:npm-release-workflow
          pnpm run test:package-candidate
      - name: Run lint
        run: pnpm run lint
      - name: Run token checks
        run: |
          pnpm run tokens:check
          pnpm run tokens:lint
      - name: Run icon checks
        run: |
          pnpm run icons:check
          pnpm run icons:lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Restore TypeScript typecheck cache
        uses: actions/cache@v4
        with:
          path: .tmp/typecheck-cache
          key: ${{ runner.os }}-fsusui-v2-typecheck-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'vue/tsconfig*.json', 'vue/packages/**/*.ts', 'vue/packages/**/*.tsx', 'vue/packages/**/*.vue', 'vue/packages/**/*.json', 'vue/internal/**/*.ts', 'vue/internal/**/*.json', 'vue/typings/**/*.d.ts', 'scripts/run-typecheck.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-v2-typecheck-
      - name: Run TypeScript typecheck across all lanes
        run: pnpm run typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore WASM artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-v2-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-v2-wasm-
      - name: Set up Emscripten when WASM cache misses
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Ensure WASM artifacts
        run: pnpm run ensure:wasm
      - name: Run Vitest unit & component suites
        run: node ./scripts/with-node-heap.mjs pnpm exec vitest run --config vue/vitest.config.ts
      - name: Verify WASM Markdown runtime
        run: |
          pnpm run check:markdown-wasm
          pnpm run check:markdown-wasm-runtime

  markdown-xss:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore WASM artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-v2-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-v2-wasm-
      - name: Set up Emscripten when WASM cache misses
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: .tmp/playwright-browsers
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - name: Install Playwright browsers for XSS DOM verification
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run Markdown XSS security gate (corpus + fuzz + 3-browser DOM)
        run: pnpm run check:markdown-xss

  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate-digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore WASM artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-v2-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-v2-wasm-
      - name: Set up Emscripten when WASM cache misses
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Use release npm toolchain
        run: npm install -g npm@^11.5.1
      - name: Build and verify immutable @ozwasyd/fsusui Pure-ESM candidate
        id: candidate
        run: |
          pnpm run ensure:wasm
          pnpm run package:candidate:build
          pnpm run package:candidate:verify
          digest="$(node -p "require('./dist/npm-candidate/fsusui-npm-candidate.manifest.json').artifact.sha256")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: fsusui-npm-candidate
          path: |
            dist/npm-candidate/fsusui-npm-candidate.tgz
            dist/npm-candidate/fsusui-npm-candidate.sha256
            dist/npm-candidate/fsusui-npm-candidate.manifest.json
          retention-days: 7

  consumer-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs:
      - build-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: actions/download-artifact@v4
        with:
          name: fsusui-npm-candidate
          path: .npm-candidate
      - name: Verify immutable npm candidate digest
        env:
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.build-package.outputs.candidate-digest }}
        run: |
          node scripts/package-candidate.mjs verify --tarball .npm-candidate/fsusui-npm-candidate.tgz --commit "$GITHUB_SHA"
          digest="$(node -p "require('./.npm-candidate/fsusui-npm-candidate.manifest.json').artifact.sha256")"
          test -n "$EXPECTED_CANDIDATE_DIGEST"
          test "$digest" = "$EXPECTED_CANDIDATE_DIGEST"
      - name: Cold consumer install, ESM subpath, TypeScript & Vite build check
        run: node scripts/verify-v2-consumer-candidate.mjs --tarball .npm-candidate/fsusui-npm-candidate.tgz

  build-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore WASM artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-v2-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-v2-wasm-
      - name: Set up Emscripten when WASM cache misses
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Build demo application
        run: pnpm run build:demo

  dotnet-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - name: Restore .NET build output cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            dotnet/**/obj
          key: ${{ runner.os }}-${{ runner.arch }}-fsusui-dotnet-sdk-${{ hashFiles('dotnet/global.json') }}-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/**/*.props', 'dotnet/**/*.targets', 'dotnet/**/*.slnx', 'dotnet/**/packages.lock.json', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fsusui-dotnet-sdk-${{ hashFiles('dotnet/global.json') }}-
      - name: Set up PDF inspection tools
        uses: ./.github/actions/setup-pdf-tools
      - name: Run platform-owned restore, build, tests, and smoke
        env:
          FSUS_DOTNET_MAX_CPU_COUNT: '4'
          FSUS_WEBVIEW_CANDIDATE_SHA: ${{ github.sha }}
        run: node scripts/dotnet-platform-verify.mjs --output dotnet/artifacts/platform/${{ matrix.platform }}/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: dotnet-platform-${{ matrix.platform }}
          path: dotnet/artifacts/platform/${{ matrix.platform }}
          retention-days: 7
      - name: Record .NET platform leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: dotnet-platform
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          dimensions: platform=${{ matrix.platform }}

  dotnet-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
    outputs:
      candidate-digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-v2-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-v2-wasm-
      - name: Set up Emscripten when WASM cache misses
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - run: pnpm install --frozen-lockfile
      - name: Ensure test artifacts ready
        run: pnpm run prepare:test-artifacts
      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: .tmp/playwright-browsers
          key: ${{ runner.os }}-ubuntu-22.04-playwright-chromium-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Pin Chromium for native screen-reader evidence
        run: node scripts/pin-render-browser.mjs .tmp/conformance-browser-selection.json
      - name: Install native screen-reader prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y orca at-spi2-core python3-pyatspi dbus-x11
      - name: Restore canonical .NET package cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            dotnet/**/obj
          key: ${{ runner.os }}-${{ runner.arch }}-fsusui-dotnet-package-ubuntu-22.04-sdk-${{ hashFiles('dotnet/global.json') }}-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/**/*.props', 'dotnet/**/*.targets', 'dotnet/**/*.slnx', 'dotnet/**/packages.lock.json', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fsusui-dotnet-package-ubuntu-22.04-sdk-${{ hashFiles('dotnet/global.json') }}-
      - name: Run Contract V2 cross-platform conformance and verify NuGet candidate
        id: candidate
        run: |
          xvfb-run -a dbus-run-session -- pnpm run conformance:v2
          node scripts/dotnet-package-verify.mjs
          digest="$(node -e '
            const { candidateSha256 } = require("./dotnet/artifacts/package/manifest.json");
            if (typeof candidateSha256 !== "string" || candidateSha256.length !== 64 || /[^0-9a-f]/u.test(candidateSha256)) {
              throw new Error("Invalid NuGet candidateSha256");
            }
            process.stdout.write(candidateSha256);
          ')"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Report workspace changes after candidate failure
        if: failure()
        run: git status --short --untracked-files=all
      - name: Retain conformance evidence after candidate failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-package-conformance-failure
          path: .tmp/conformance-v2
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-nuget-candidate
          path: |
            dotnet/artifacts/nuget
            dotnet/artifacts/package/manifest.json
            dotnet/artifacts/package/contract-v2-alignment.json
          retention-days: 7
      - name: Record unique NuGet candidate leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: dotnet-package
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          artifacts: nuget-candidate=dotnet/artifacts

  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FSUS_VISUAL_EVIDENCE: ${{ inputs.group == 'release' && '1' || '0' }}
      FSUS_VISUAL_SUITE_MODE: auto
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore WASM artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-v2-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-v2-wasm-
      - name: Set up Emscripten when WASM cache misses
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: .tmp/playwright-browsers
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Probe visual capacity
        run: pnpm visual:capacity
      - name: Print visual execution plan
        run: pnpm test:visual:plan
      - name: Run visual suites
        run: |
          if [ "${{ inputs.group }}" = "release" ]; then
            pnpm test:visual:evidence
          else
            pnpm test:visual:full
          fi
      - uses: actions/upload-artifact@v4
        if: failure() && inputs.group != 'release'
        continue-on-error: true
        with:
          name: avalonia-screenshots-${{ inputs.group }}
          path: |
            playwright-report/profile-*
            vue/test-results/profile-*
      - uses: actions/upload-artifact@v4
        if: always() && inputs.group == 'release'
        continue-on-error: true
        with:
          name: avalonia-screenshots-${{ inputs.group }}
          path: |
            playwright-report/profile-*
            vue/test-results/profile-*
            .tmp/visual-evidence/manifest.json
            .tmp/visual-runtime/manifest.json
            screenshots
      - name: Record visual leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: visual
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          dimensions: profile=${{ inputs.group == 'release' && 'evidence' || 'full' }}
