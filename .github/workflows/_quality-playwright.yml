          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run playwright visual-reuse owner policy check
        run: node scripts/check-playwright-visual-reuse-owner-policy.mjs
      - uses: actions/download-artifact@v4
        if: inputs.group == 'pr'
        with:
          name: playwright-pr-impact-plan
          path: .tmp/playwright-impact
      - name: Run playwright visual-reuse owner cells
        run: >-
          node scripts/visual-reuse-playwright-owner-run.mjs
          --owner visual-runtime-reuse
          --group ${{ inputs.group }}
          --impact-plan ${{ inputs.group == 'pr' && '.tmp/playwright-impact/receipt.json' || '' }}
          --runtime-dir .tmp/visual-runtime-reuse-runtime
          --evidence-dir .tmp/visual-runtime-reuse
          --server-port 4182
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: visual-runtime-reuse-evidence-${{ inputs.group }}
          path: |
            .tmp/visual-runtime-reuse
            .tmp/visual-runtime-reuse-runtime/manifest.json
            .readiness/receipts/visual-runtime-reuse
          retention-days: 14
      - name: Record visual runtime reuse leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: visual-runtime-reuse
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          playwright-receipts: .readiness/receipts/visual-runtime-reuse
          playwright-plan: ${{ inputs.group == 'pr' && '.tmp/playwright-impact/receipt.json' || '' }}

  playwright-pr-readiness:
    if: always() && inputs.group == 'pr'
    needs:
      - playwright-pr-impact-plan
      - playwright-layout
      - playwright-markdown
      - playwright-motion
      - playwright-boundary
      - visual-runtime-reuse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: playwright-pr-impact-plan
          path: .tmp/playwright-impact
      - uses: actions/download-artifact@v4
        with:
          pattern: readiness-manifest-playwright-*
          path: .readiness
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: readiness-manifest-visual-runtime-reuse-*
          path: .readiness
          merge-multiple: true
      - name: Aggregate PR playwright leaf evidence
        run: >-
          node scripts/ci-readiness.mjs check
          --profile pr-playwright
          --workflow-group pr
          --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --plan-receipt .tmp/playwright-impact/receipt.json
          --evidence .readiness/evidence/playwright-pr.json
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-readiness-evidence
          path: .readiness/evidence/playwright-pr.json
          retention-days: 7
