    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: .tmp/playwright-browsers
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('vue/packages/icons-vue/package.json', 'vue/packages/icons-vue/src/**', 'vue/packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install Firefox for view-transitions cells
        if: ${{ inputs.group != 'pr' }}
        run: pnpm exec playwright install --with-deps firefox
      - name: Install WebKit for view-transitions cells
        if: ${{ inputs.group != 'pr' }}
        run: pnpm exec playwright install --with-deps webkit
      - name: Run playwright motion owner policy check
        run: node scripts/check-playwright-motion-owner-policy.mjs
      - uses: actions/download-artifact@v4
        if: inputs.group == 'pr'
        with:
          name: playwright-pr-impact-plan
          path: .tmp/playwright-impact
      - name: Run playwright motion owner cells
        run: >-
          node scripts/motion-playwright-owner-run.mjs
          --owner playwright-motion
          --group ${{ inputs.group }}
          --impact-plan ${{ inputs.group == 'pr' && '.tmp/playwright-impact/receipt.json' || '' }}
          --evidence-dir .tmp/playwright-motion
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-motion-evidence-${{ inputs.group }}
          path: |
            .tmp/playwright-motion
            .readiness/receipts/playwright-motion
          retention-days: 14
      - name: Record playwright motion leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: playwright-motion
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          playwright-receipts: .readiness/receipts/playwright-motion
          playwright-plan: ${{ inputs.group == 'pr' && '.tmp/playwright-impact/receipt.json' || '' }}

  playwright-boundary:
    needs: playwright-pr-impact-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: .tmp/playwright-browsers
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('vue/packages/icons-vue/package.json', 'vue/packages/icons-vue/src/**', 'vue/packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install WebKit for safe-area cells
        if: ${{ inputs.group != 'pr' }}
        run: pnpm exec playwright install --with-deps webkit
      - name: Run playwright boundary owner policy check
        run: node scripts/check-playwright-boundary-owner-policy.mjs
      - uses: actions/download-artifact@v4
        if: inputs.group == 'pr'
        with:
          name: playwright-pr-impact-plan
          path: .tmp/playwright-impact
      - name: Prepare visual runtime once
        run: node ./scripts/with-node-heap.mjs node ./scripts/prepare-visual-runtime.mjs --runtime-dir=.tmp/visual-runtime-playwright
      - name: Run playwright boundary owner cells
        run: >-
          node scripts/boundary-playwright-owner-run.mjs
          --owner playwright-boundary
          --group ${{ inputs.group }}
          --impact-plan ${{ inputs.group == 'pr' && '.tmp/playwright-impact/receipt.json' || '' }}
          --runtime-dir .tmp/visual-runtime-playwright
          --evidence-dir .tmp/playwright-boundary
          --server-port 4182
          --skip-prepare
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-boundary-evidence-${{ inputs.group }}
          path: |
            .tmp/playwright-boundary
            .tmp/visual-runtime-playwright/manifest.json
            .readiness/receipts/playwright-boundary
          retention-days: 14
      - name: Record playwright boundary leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: playwright-boundary
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          playwright-receipts: .readiness/receipts/playwright-boundary
          playwright-plan: ${{ inputs.group == 'pr' && '.tmp/playwright-impact/receipt.json' || '' }}
  visual-runtime-reuse:
    needs: playwright-pr-impact-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: .tmp/playwright-browsers
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('vue/packages/icons-vue/package.json', 'vue/packages/icons-vue/src/**', 'vue/packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
