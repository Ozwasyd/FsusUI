          path: .tmp/playwright-impact
      - name: Run playwright markdown owner cells
        run: >-
          node scripts/markdown-playwright-owner-run.mjs
          --owner playwright-markdown
          --group ${{ inputs.group }}
          --impact-plan ${{ inputs.group == 'pr' && '.tmp/playwright-impact/receipt.json' || '' }}
          --evidence-dir .tmp/playwright-markdown
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-markdown-evidence-${{ inputs.group }}
          path: |
            .tmp/playwright-markdown
            .readiness/receipts/playwright-markdown
          retention-days: 14
      - name: Record playwright markdown leaf result
        if: always()
        uses: ./.github/actions/readiness-manifest
        with:
          gate: playwright-markdown
          group: ${{ inputs.group }}
          status: ${{ job.status }}
          playwright-receipts: .readiness/receipts/playwright-markdown
          playwright-plan: ${{ inputs.group == 'pr' && '.tmp/playwright-impact/receipt.json' || '' }}
  playwright-motion:
    needs: playwright-pr-impact-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
