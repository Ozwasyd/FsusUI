name: FsusUI Avalonia shared layout CPU-clock diagnostic

on:
  push:
    branches:
      - codex/fsusui-avalonia-layout-clock
    paths:
      - .github/workflows/fsusui-avalonia-layout-clock.yml
      - scripts/avalonia-layout-clock/**

permissions:
  contents: read

concurrency:
  group: fsusui-avalonia-layout-clock
  cancel-in-progress: false

jobs:
  avalonia-layout-clock:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      BASE_SHA: f2d929a5d045439c35e93b4771f912ce50ec2337
      CANDIDATE_SHA: 340712f4049e03e3282ad92f3c0f4d8121bd85d9
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/dotnet/global.json
      - name: Verify the pinned SDK and actual application runtime
        working-directory: candidate/dotnet
        run: |
          mkdir -p "$GITHUB_WORKSPACE/native-diagnostic-environment"
          test "$(dotnet --version)" = "10.0.401"
          dotnet --list-runtimes | tee "$GITHUB_WORKSPACE/native-diagnostic-environment/dotnet-runtimes.txt"
          grep -q '^Microsoft.NETCore.App 10\.0\.15 ' "$GITHUB_WORKSPACE/native-diagnostic-environment/dotnet-runtimes.txt"
          dotnet --info > "$GITHUB_WORKSPACE/native-diagnostic-environment/dotnet-info.txt"
          printf '%s\n' "ImageOS=${ImageOS:-unknown}" "ImageVersion=${ImageVersion:-unknown}" > "$GITHUB_WORKSPACE/native-diagnostic-environment/runner-image.txt"
      - name: Ensure native display and font dependencies are present
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libfontconfig1 libx11-6 libx11-xcb1 libxcb1 libgl1 libice6 libsm6 libxext6 libxrender1 fonts-liberation
          command -v xvfb-run
          fc-match "Noto Sans CJK SC" > "$GITHUB_WORKSPACE/native-diagnostic-environment/font-match.txt"
      - name: Verify diagnostic controller syntax and fixed arm selection
        working-directory: controller
        run: |
          python3 -m py_compile scripts/avalonia-layout-clock/{build,run,overlay}.py
          DIAGNOSTIC_DRIVER_TEST="$GITHUB_WORKSPACE/candidate/dotnet/FsusUI.Avalonia.Demo/RenderPerformanceRunner.cs" python3 scripts/avalonia-layout-clock/test.py
          python3 scripts/avalonia-layout-clock/run.py --plan > "$GITHUB_WORKSPACE/native-diagnostic-environment/plan.json"
      - name: Build each exact Demo once and run fixed and variable ABBA
        timeout-minutes: 20
        working-directory: controller
        run: |
          python3 scripts/avalonia-layout-clock/build.py \
            --baseline "$GITHUB_WORKSPACE/baseline" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --output "$GITHUB_WORKSPACE/native-layout-clock-evidence"
      - name: Preserve diagnostic provenance, raw samples and comparison
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avalonia-layout-clock
          path: |
            native-diagnostic-environment/
            native-layout-clock-evidence/
          retention-days: 7
