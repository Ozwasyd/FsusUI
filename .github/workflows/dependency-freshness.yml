name: Dependency freshness blockers

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: dependency-freshness-blockers
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Produce the unique structured freshness result
        id: freshness
        continue-on-error: true
        run: pnpm deps:freshness -- --output .tmp/dependency-freshness.json
      - name: Reconcile the exact-one blocker issue and PR labels
        if: always() && steps.freshness.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/dependency-freshness-blocker.mjs
          --report .tmp/dependency-freshness.json
          --repo "${{ github.repository }}"
      - name: Preserve freshness failure
        if: steps.freshness.outcome == 'failure'
        run: exit 1
