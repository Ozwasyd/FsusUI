name: FsusUI Avalonia formal split integration smoke

on:
  push:
    branches:
      - codex/fsusui-avalonia-split-smoke
    paths:
      - .github/workflows/fsusui-avalonia-split-smoke.yml

permissions:
  contents: read

concurrency:
  group: fsusui-avalonia-split-smoke
  cancel-in-progress: false

jobs:
  avalonia-split-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      BASE_SHA: f2d929a5d045439c35e93b4771f912ce50ec2337
      FSUSUI_AVALONIA_MEASUREMENT_PROTOCOL: variable-list-layout-ready.v2
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: controller/dotnet/global.json
      - name: Verify the pinned SDK and actual application runtime
        working-directory: controller/dotnet
        run: |
          mkdir -p "$GITHUB_WORKSPACE/native-diagnostic-environment"
          test "$(dotnet --version)" = "10.0.401"
          dotnet --list-runtimes | tee "$GITHUB_WORKSPACE/native-diagnostic-environment/dotnet-runtimes.txt"
          grep -q '^Microsoft.NETCore.App 10\.0\.15 ' "$GITHUB_WORKSPACE/native-diagnostic-environment/dotnet-runtimes.txt"
          dotnet --info > "$GITHUB_WORKSPACE/native-diagnostic-environment/dotnet-info.txt"
          printf '%s\n' "ImageOS=${ImageOS:-unknown}" "ImageVersion=${ImageVersion:-unknown}" > "$GITHUB_WORKSPACE/native-diagnostic-environment/runner-image.txt"
      - name: Ensure native display and font dependencies are present
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libfontconfig1 libx11-6 libx11-xcb1 libxcb1 libgl1 libice6 libsm6 libxext6 libxrender1 fonts-liberation
          command -v xvfb-run
          fc-match "Noto Sans CJK SC" > "$GITHUB_WORKSPACE/native-diagnostic-environment/font-match.txt"
      - name: Create an explicitly native-only integration plan
        working-directory: controller
        shell: bash
        run: |
          export PLAN="$GITHUB_WORKSPACE/avalonia-split-plan.json"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict'
          import { writeFile } from 'node:fs/promises'
          import { createImpactPlan, loadOwnershipRegistry } from './scripts/render-performance-impact.mjs'
          const registry = await loadOwnershipRegistry(process.cwd())
          const plan = createImpactPlan({
            changedFiles: ['dotnet/FsusUI.Avalonia.Demo/RenderPerformanceRunner.cs'],
            registry, baseRef: process.env.BASE_SHA,
          })
          assert.equal(plan.scope, 'avalonia-only')
          assert.equal(plan.platforms.avalonia.scenario, null)
          await writeFile(process.env.PLAN, JSON.stringify(plan, null, 2) + '\n')
          NODE
      - name: Verify patched controller contract with the candidate app
        timeout-minutes: 8
        working-directory: controller
        run: |
          node scripts/run-render-performance.mjs \
            --impact-plan "$GITHUB_WORKSPACE/avalonia-split-plan.json" \
            --profile quick --output "$GITHUB_WORKSPACE/split-candidate"
      - name: Verify exact historical baseline classification with both isolated outputs
        timeout-minutes: 16
        working-directory: baseline
        run: |
          node ../controller/scripts/run-historical-render-baseline.mjs \
            --directory . --expected-sha "$BASE_SHA" \
            --impact-plan "$GITHUB_WORKSPACE/avalonia-split-plan.json" \
            --output "$GITHUB_WORKSPACE/split-baseline"
      - name: Preserve both source-and-process-bound smoke results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avalonia-split-smoke
          path: |
            native-diagnostic-environment/
            avalonia-split-plan.json
            split-candidate/
            split-baseline/
          retention-days: 7
