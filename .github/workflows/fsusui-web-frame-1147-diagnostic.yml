name: FsusUI Web fixed-list and table frame diagnostic

on:
  push:
    branches:
      - codex/fsusui-web-frame-1147-diagnostic
    paths:
      - .github/workflows/fsusui-web-frame-1147-diagnostic.yml
      - .github/diagnostics/web-frame-1147/**

permissions:
  contents: read

concurrency:
  group: fsusui-web-frame-1147-diagnostic
  cancel-in-progress: false

jobs:
  web-frame-1147-diagnostic:
    if: github.repository == 'Ozwasyd/FsusUI'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      BASE_SHA: f2d929a5d045439c35e93b4771f912ce50ec2337
      CANDIDATE_SHA: 85ac42755432f06aa6b8fbdff751a98b29b8dad6
      CANDIDATE_TREE: 302622aed21489a1d04e468a1cc2fa4815696ac8
      BLOCKS_PER_KIND: '4'
      SEED: '1147'
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: pnpm
          cache-dependency-path: |
            baseline/pnpm-lock.yaml
            candidate/pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - name: Verify exact worktrees and bundled diagnostic transform
        working-directory: controller/.github/diagnostics/web-frame-1147
        env:
          FSUSUI_WEB_FRAME_DIAGNOSTIC_ARCHIVE: archive
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/baseline" rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(node --version)" = v22.23.5
          test "$(pnpm --version)" = 10.33.0
          python3 -m unittest -v
          mkdir -p "$GITHUB_WORKSPACE/web-frame-1147-environment"
          printf '%s\n' "ImageOS=${ImageOS:-unknown}" "ImageVersion=${ImageVersion:-unknown}" > "$GITHUB_WORKSPACE/web-frame-1147-environment/runner-image.txt"
          printf '%s\n' "$BASE_SHA" "$CANDIDATE_SHA" "$CANDIDATE_TREE" > "$GITHUB_WORKSPACE/web-frame-1147-environment/sources.txt"
          sha256sum archive/performance-current/web/measurement-effective.mjs > "$GITHUB_WORKSPACE/web-frame-1147-environment/original-driver.sha256"
      - name: Prepare exact historical Web runtime
        working-directory: baseline
        run: |
          pnpm install --frozen-lockfile
          pnpm run ensure:wasm
      - name: Prepare exact candidate Web runtime
        working-directory: candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm run ensure:wasm
          pnpm exec playwright install --with-deps chromium
      - name: Pin Chromium and check actual idle cadence
        working-directory: candidate
        timeout-minutes: 2
        run: |
          node scripts/pin-render-browser.mjs "$GITHUB_WORKSPACE/web-frame-1147-environment/browser-selection.json"
          export FSUSUI_PERF_BROWSER_EXECUTABLE
          FSUSUI_PERF_BROWSER_EXECUTABLE="$(node -p "require(process.argv[1]).executable" "$GITHUB_WORKSPACE/web-frame-1147-environment/browser-selection.json")"
          node scripts/render-ci-web-preflight.mjs "$GITHUB_WORKSPACE/web-frame-1147-environment/idle-cadence.json"
      - name: Run all predetermined AB and AA blocks on this runner
        working-directory: controller/.github/diagnostics/web-frame-1147
        timeout-minutes: 24
        run: |
          python3 run.py \
            --archive archive \
            --baseline "$GITHUB_WORKSPACE/baseline" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --helpers "$GITHUB_WORKSPACE/candidate/scripts" \
            --playwright "$GITHUB_WORKSPACE/candidate/node_modules/@playwright/test/index.js" \
            --chrome "$FSUSUI_PERF_BROWSER_EXECUTABLE" \
            --blocks-per-kind "$BLOCKS_PER_KIND" \
            --seed "$SEED" \
            --out "$GITHUB_WORKSPACE/web-frame-1147-results"
      - name: Retain all raw frame anchors and partial runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-frame-1147-diagnostic
          path: |
            web-frame-1147-environment/
            web-frame-1147-results/
          retention-days: 7
