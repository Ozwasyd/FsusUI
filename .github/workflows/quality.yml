name: Quality Gates

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: Quality group to run
        default: main
        required: false
        type: choice
        options:
          - main
          - nightly
          - release
      release_tag:
        description: Optional v-prefixed package version for manual Release identity evidence
        default: ''
        required: false
        type: string

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  premerge-main:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: ./.github/workflows/_quality.yml
    with:
      group: main

  premerge-playwright:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: ./.github/workflows/_quality-playwright.yml
    with:
      group: pr

  premerge-readiness:
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs:
      - premerge-main
      - premerge-playwright
    uses: ./.github/workflows/_quality-readiness.yml
    with:
      group: main
      playwright_group: pr

  pr-fast:
    if: always() && github.event_name == 'pull_request'
    needs:
      - premerge-main
      - premerge-playwright
      - premerge-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce complete PR merge readiness
        env:
          PREMERGE_MAIN_RESULT: ${{ needs.premerge-main.result }}
          PR_PLAYWRIGHT_RESULT: ${{ needs.premerge-playwright.result }}
          PREMERGE_READINESS_RESULT: ${{ needs.premerge-readiness.result }}
        run: |
          echo "premerge-main=${PREMERGE_MAIN_RESULT}"
          echo "premerge-playwright=${PR_PLAYWRIGHT_RESULT}"
          echo "premerge-readiness=${PREMERGE_READINESS_RESULT}"
          test "${PREMERGE_MAIN_RESULT}" = "success"
          test "${PR_PLAYWRIGHT_RESULT}" = "success"
          test "${PREMERGE_READINESS_RESULT}" = "success"

  merge-group-pr-fast:
    name: pr-fast
    if: always() && github.event_name == 'merge_group'
    needs:
      - premerge-main
      - premerge-playwright
      - premerge-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve required PR gate on merge queue candidates
        env:
          PREMERGE_MAIN_RESULT: ${{ needs.premerge-main.result }}
          PR_PLAYWRIGHT_RESULT: ${{ needs.premerge-playwright.result }}
          PREMERGE_READINESS_RESULT: ${{ needs.premerge-readiness.result }}
        run: |
          test "${PREMERGE_MAIN_RESULT}" = "success"
          test "${PR_PLAYWRIGHT_RESULT}" = "success"
          test "${PREMERGE_READINESS_RESULT}" = "success"

  main:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.group == 'main')
    uses: ./.github/workflows/_quality.yml
    with:
      group: main

  main-playwright:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.group == 'main')
    uses: ./.github/workflows/_quality-playwright.yml
    with:
      group: main

  main-readiness:
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.group == 'main'))
    needs:
      - main
      - main-playwright
    uses: ./.github/workflows/_quality-readiness.yml
    with:
      group: main
      playwright_group: main

  nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.group == 'nightly')
    uses: ./.github/workflows/_quality.yml
    with:
      group: nightly

  nightly-playwright:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.group == 'nightly')
    uses: ./.github/workflows/_quality-playwright.yml
    with:
      group: nightly

  nightly-readiness:
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.group == 'nightly'))
    needs:
      - nightly
      - nightly-playwright
    uses: ./.github/workflows/_quality-readiness.yml
    with:
      group: nightly
      playwright_group: nightly

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.group == 'release'
    uses: ./.github/workflows/_quality.yml
    with:
      group: release
      release_tag: ${{ inputs.release_tag }}

  release-playwright:
    if: github.event_name == 'workflow_dispatch' && inputs.group == 'release'
    uses: ./.github/workflows/_quality-playwright.yml
    with:
      group: release

  release-readiness:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.group == 'release'
    needs:
      - release
      - release-playwright
    uses: ./.github/workflows/_quality-readiness.yml
    with:
      group: release
      playwright_group: release
      release_tag: ${{ inputs.release_tag }}
