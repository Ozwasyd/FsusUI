name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  pr-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('packages/icons-vue/package.json', 'packages/icons-vue/src/**', 'packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('packages/wasm/package.json', 'packages/wasm/build.config.ts', 'packages/wasm/**/*.ts', 'packages/wasm/**/*.cpp', 'packages/wasm/**/*.hpp', 'packages/wasm/**/*.h', 'packages/wasm/**/CMakeLists.txt', 'packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - name: Restore TypeScript typecheck cache
        id: typecheck-cache
        uses: actions/cache@v4
        with:
          path: .tmp/typecheck-cache
          key: ${{ runner.os }}-fsusui-typecheck-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'tsconfig*.json', 'packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.vue', 'packages/**/*.json', 'internal/**/*.ts', 'internal/**/*.json', 'typings/**/*.d.ts', 'scripts/run-typecheck.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-typecheck-
      - name: Log TypeScript typecheck cache status
        run: |
          echo "typecheck-cache-hit=${{ steps.typecheck-cache.outputs.cache-hit }}"
          echo "cache-hit=${{ steps.typecheck-cache.outputs.cache-hit }}"
          echo "cache-primary-key=${{ steps.typecheck-cache.outputs.cache-primary-key }}"
      - run: pnpm run verify:pr-fast

  full:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_quality.yml
