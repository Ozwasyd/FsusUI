name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: Quality group to run
        default: main
        required: false
        type: choice
        options:
          - main
          - nightly
          - release
      release_tag:
        description: Optional v-prefixed package version for manual Release identity evidence
        default: ''
        required: false
        type: string

jobs:
  pr-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Restore icons test artifact cache
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/icons-vue/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-icons-${{ hashFiles('vue/packages/icons-vue/package.json', 'vue/packages/icons-vue/src/**', 'vue/packages/icons-vue/build/**', 'scripts/ensure-icons-artifacts.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-icons-
      - name: Restore WASM test artifact cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: vue/packages/wasm/dist
          key: ${{ runner.os }}-fsusui-test-artifacts-wasm-${{ hashFiles('vue/packages/wasm/package.json', 'vue/packages/wasm/build.config.ts', 'vue/packages/wasm/**/*.ts', 'vue/packages/wasm/**/*.cpp', 'vue/packages/wasm/**/*.hpp', 'vue/packages/wasm/**/*.h', 'vue/packages/wasm/**/CMakeLists.txt', 'vue/packages/wasm/build.sh', 'scripts/ensure-wasm-artifacts.mjs', 'scripts/run-wasm-build.mjs', 'scripts/prepare-test-artifacts.mjs', 'scripts/test-artifact-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-test-artifacts-wasm-
      - name: Log test artifact cache status
        run: |
          echo "icons-cache-hit=${{ steps.icons-cache.outputs.cache-hit }}"
          echo "wasm-cache-hit=${{ steps.wasm-cache.outputs.cache-hit }}"
      - name: Restore TypeScript typecheck cache
        id: typecheck-cache
        uses: actions/cache@v4
        with:
          path: .tmp/typecheck-cache
          key: ${{ runner.os }}-fsusui-typecheck-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'vue/tsconfig*.json', 'vue/packages/**/*.ts', 'vue/packages/**/*.tsx', 'vue/packages/**/*.vue', 'vue/packages/**/*.json', 'vue/internal/**/*.ts', 'vue/internal/**/*.json', 'vue/typings/**/*.d.ts', 'scripts/run-typecheck.mjs') }}
          restore-keys: |
            ${{ runner.os }}-fsusui-typecheck-
      - name: Log TypeScript typecheck cache status
        run: |
          echo "typecheck-cache-hit=${{ steps.typecheck-cache.outputs.cache-hit }}"
          echo "cache-hit=${{ steps.typecheck-cache.outputs.cache-hit }}"
          echo "cache-primary-key=${{ steps.typecheck-cache.outputs.cache-primary-key }}"
      - run: pnpm run verify:pr-fast
      - name: Refresh stale generated baselines on the PR branch
        if: failure() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          pnpm run avalonia:baseline
          pnpm run build:theme
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const snapshotPath = 'vue/packages/theme-chalk/theme-package.snapshot.json'
          const cssPath = 'vue/packages/theme-chalk/dist/el-fsus.css'
          const snapshot = JSON.parse(fs.readFileSync(snapshotPath, 'utf8'))
          const css = fs.readFileSync(cssPath)
          snapshot.bytes = css.byteLength
          snapshot.sha256 = crypto.createHash('sha256').update(css).digest('hex')
          fs.writeFileSync(snapshotPath, `${JSON.stringify(snapshot, null, 2)}\n`)
          console.log({ bytes: snapshot.bytes, sha256: snapshot.sha256 })
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/baselines/vue-current.json docs/avalonia/vue-public-api-baseline.md vue/packages/theme-chalk/theme-package.snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "test(ci): refresh generated baselines"
            git push origin HEAD:"$HEAD_BRANCH"
          fi
      - name: Determine PR demo build path impact
        id: demo-build-path
        run: node ./scripts/with-node-heap.mjs node ./scripts/should-run-demo-build.mjs
      - name: Log PR demo build path decision
        run: |
          echo "demo-build-run=${{ steps.demo-build-path.outputs.run }}"
          echo "demo-build-reason=${{ steps.demo-build-path.outputs.reason }}"
      - name: Run PR demo build
        if: steps.demo-build-path.outputs.run == 'true'
        run: pnpm run build:demo
      - name: Skip PR demo build
        if: steps.demo-build-path.outputs.run != 'true'
        run: |
          echo "Skipping demo build: ${{ steps.demo-build-path.outputs.reason }}"

  pr-real-render-performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current change
        uses: actions/checkout@v4
        with:
          path: current
          fetch-depth: 0
      - name: Checkout base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Plan PR real-render impact before heavy setup
        id: render-impact
        working-directory: current
        run: >-
          node scripts/render-performance-impact-plan.mjs
          --base ${{ github.event.pull_request.base.sha }}
          --output ../performance-impact-plan.json
      - name: Log PR real-render impact
        run: |
          echo "run=${{ steps.render-impact.outputs.run }}"
          echo "scope=${{ steps.render-impact.outputs.scope }}"
          echo "plan-digest=${{ steps.render-impact.outputs.digest }}"
          echo "reason=${{ steps.render-impact.outputs.reason }}"
      - uses: pnpm/action-setup@v4
        if: steps.render-impact.outputs.run == 'true'
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        if: steps.render-impact.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            current/pnpm-lock.yaml
            baseline/pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        if: >-
          steps.render-impact.outputs.run == 'true' &&
          steps.render-impact.outputs.scope != 'avalonia-only'
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-dotnet@v4
        if: >-
          steps.render-impact.outputs.run == 'true' &&
          steps.render-impact.outputs.scope != 'web-only'
        with:
          global-json-file: current/dotnet/global.json
      - name: Check baseline runner contract
        id: baseline-contract
        if: steps.render-impact.outputs.run == 'true'
        run: >-
          node current/scripts/check-render-performance-baseline.mjs
          --directory baseline
          --plan performance-impact-plan.json
          --output performance-baseline/baseline-status.json
      - name: Install current dependencies
        if: steps.render-impact.outputs.run == 'true'
        working-directory: current
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and web display dependencies once
        if: >-
          steps.render-impact.outputs.run == 'true' &&
          steps.render-impact.outputs.scope != 'avalonia-only'
        working-directory: current
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Avalonia-only display dependency
        if: steps.render-impact.outputs.scope == 'avalonia-only'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
      - name: Install baseline dependencies
        if: steps.baseline-contract.outputs.available == 'true'
        working-directory: baseline
        run: pnpm install --frozen-lockfile
      - name: Prepare baseline WASM artifacts
        if: >-
          steps.baseline-contract.outputs.available == 'true' &&
          steps.render-impact.outputs.scope != 'avalonia-only'
        working-directory: baseline
        run: pnpm run ensure:wasm
      - name: Prepare current WASM artifacts
        if: >-
          steps.render-impact.outputs.run == 'true' &&
          steps.render-impact.outputs.scope != 'avalonia-only'
        working-directory: current
        run: pnpm run ensure:wasm
      - name: Measure same-runner baseline first
        if: steps.baseline-contract.outputs.available == 'true'
        working-directory: baseline
        run: >-
          pnpm perf:render --
          --impact-plan ../performance-impact-plan.json
          --profile quick
          --output ../performance-baseline
      - name: Measure current quick matrix
        if: steps.render-impact.outputs.run == 'true'
        working-directory: current
        run: >-
          pnpm perf:render --
          --impact-plan ../performance-impact-plan.json
          --profile quick
          --output ../performance-current
      - name: Compare against base revision on the same runner
        if: steps.baseline-contract.outputs.available == 'true'
        working-directory: current
        run: pnpm perf:render:compare -- ../performance-baseline ../performance-current 0.15
      - name: Skip unaffected PR real-render measurement
        if: steps.render-impact.outputs.run != 'true'
        run: echo "Skipping real-render measurement; ownership plan is skip-safe."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-real-render-performance
          path: |
            performance-baseline
            performance-current
            performance-impact-plan.json
          retention-days: 14

  main:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.group == 'main')
    uses: ./.github/workflows/_quality.yml
    with:
      group: main

  nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.group == 'nightly')
    uses: ./.github/workflows/_quality.yml
    with:
      group: nightly

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.group == 'release'
    uses: ./.github/workflows/_quality.yml
    with:
      group: release
      release_tag: ${{ inputs.release_tag }}
