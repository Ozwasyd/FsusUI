name: Quality Gates

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
      - master
      - next
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: Quality group to run
        default: main
        required: false
        type: choice
        options:
          - main
          - nightly
          - release
      release_tag:
        description: Optional v-prefixed package version for manual Release identity evidence
        default: ''
        required: false
        type: string

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      group: ${{ inputs.group || (github.event_name == 'schedule' && 'nightly' || 'main') }}
      release_tag: ${{ inputs.release_tag || '' }}

  pr-fast:
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce complete PR merge readiness
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          echo "quality=${QUALITY_RESULT}"
          test "${QUALITY_RESULT}" = "success"
