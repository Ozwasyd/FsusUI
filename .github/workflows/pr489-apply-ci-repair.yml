name: Apply PR 489 CI repair

on:
  push:
    branches:
      - agent/issue-479-playwright-registry

permissions:
  contents: write

# Triggered after the workflow exists on the branch so GitHub registers it.
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-479-playwright-registry
          fetch-depth: 0
      - name: Restore performance preparation and expose failed capacity task
        shell: bash
        run: |
          git checkout b659387746ae5e23c21450b4311e7698519609fc^ -- .github/workflows/quality.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-capacity-suite.mjs')
          source = path.read_text(encoding='utf-8')
          old = """    child.on('close', (code) => resolve(code ?? 1))
"""
          new = """    child.on('close', (code) => {
      const status = code ?? 1
      if (status === 0) {
        console.log(`[ci-capacity] ${task} passed`)
      } else {
        console.error(`[ci-capacity] ${task} failed (exit ${status})`)
        console.error(`::error title=CI capacity task failed::${task} exited with ${status}`)
      }
      resolve(status)
    })
"""
          if old not in source:
              raise SystemExit('Expected runTask close handler was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/quality.yml scripts/run-capacity-suite.mjs
          git commit -m "fix(ci): restore performance artifacts and expose gate failures"
          git push origin HEAD:agent/issue-479-playwright-registry
