name: Publish npm Package

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      package: ${{ steps.plan.outputs.package }}
      version: ${{ steps.plan.outputs.version }}
      dist-tag: ${{ steps.plan.outputs.dist_tag }}
      concurrency-group: ${{ steps.plan.outputs.concurrency_group }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Resolve canonical release resource
        id: plan
        run: |
          pnpm release:concurrency:plan \
            --package @ozwasyd/element-plus \
            --version "${GITHUB_REF_NAME#v}" \
            --github-output

  quality:
    needs: quality-playwright
    uses: ./.github/workflows/_quality.yml
    with:
      group: release
      release_tag: ${{ github.ref_name }}

  quality-playwright:
    uses: ./.github/workflows/_quality-playwright.yml
    with:
      group: release

  fsusblog-consumer:
    needs: [quality, plan]
    uses: ./.github/workflows/_fsusblog-consumer-gate.yml
    with:
      candidate-artifact-name: fsusui-npm-candidate
      candidate-manifest-name: fsusui-npm-candidate.manifest.json
      candidate-digest: ${{ needs.quality.outputs.npm-candidate-digest }}
      quality-candidate-digest: ${{ needs.quality.outputs.npm-candidate-digest }}
      matrix-artifact-name: consumer-matrix-release
      target-repository: Ozwasyd/FsusBlog
    secrets:
      FSUS_CROSS_REPO_APP_PRIVATE_KEY: ${{ secrets.FSUS_CROSS_REPO_APP_PRIVATE_KEY }}

  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, plan, fsusblog-consumer]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: actions/download-artifact@v4
        with:
          name: fsusui-npm-candidate
          path: .npm-candidate
      - uses: actions/download-artifact@v4
        with:
          name: fsusblog-consumer-gate
          path: .cross-gate
      - name: Verify candidate and release plan before lock
        run: |
          test -n "${{ needs.quality.outputs.release-readiness-digest }}"
          pnpm run package:candidate:verify -- --tarball .npm-candidate/fsusui-npm-candidate.tgz --tag-version "${GITHUB_REF_NAME}"
          digest="$(node -p "require('./.npm-candidate/fsusui-npm-candidate.manifest.json').artifact.sha256")"
          test "${digest}" = "${{ needs.quality.outputs.npm-candidate-digest }}"
          candidate_group="$(pnpm --silent release:concurrency:plan \
            --package '${{ needs.plan.outputs.package }}' \
            --version '${{ needs.plan.outputs.version }}' \
            --candidate-manifest .npm-candidate/fsusui-npm-candidate.manifest.json)"
          test "${candidate_group}" = "${{ needs.plan.outputs.concurrency-group }}"
          test '${{ needs.fsusblog-consumer.outputs.receipt-status }}' = 'success'
          node scripts/verify-cross-repo-receipt.mjs \
            --receipt .cross-gate/fsusblog-consumer-gate.receipt.json \
            --receipt-digest '${{ needs.fsusblog-consumer.outputs.receipt-sha256 }}' \
            --candidate-manifest .npm-candidate/fsusui-npm-candidate.manifest.json \
            --candidate-digest '${{ needs.quality.outputs.npm-candidate-digest }}' \
            --source-commit "$GITHUB_SHA" \
            --release-tag "$GITHUB_REF_NAME"
      - name: Read npm channel state before lock
        id: npm_state
        run: |
          node scripts/npm-channel-state.mjs \
            --package '${{ needs.plan.outputs.package }}' \
            --candidate '${{ needs.plan.outputs.version }}' \
            --channel '${{ needs.plan.outputs.dist-tag }}' \
            --github-output
      - name: Check channel monotonicity before lock
        run: |
          pnpm release:channel:check \
            --candidate '${{ needs.plan.outputs.version }}' \
            --current '${{ steps.npm_state.outputs.current }}' \
            --candidate-exists '${{ steps.npm_state.outputs.candidate_exists }}'

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, plan, preflight, fsusblog-consumer]
    concurrency:
      group: ${{ needs.plan.outputs.concurrency-group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Use npm 11.5.1+
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - uses: actions/download-artifact@v4
        with:
          name: fsusui-npm-candidate
          path: .npm-candidate
      - name: Download successful FsusBlog consumer gate receipt
        uses: actions/download-artifact@v4
        with:
          name: fsusblog-consumer-gate
          path: .cross-gate
      - name: Verify locked candidate identity
        run: |
          test -n "${{ needs.quality.outputs.release-readiness-digest }}"
          pnpm run package:candidate:verify -- --tarball .npm-candidate/fsusui-npm-candidate.tgz --tag-version "${GITHUB_REF_NAME}"
          digest="$(node -p "require('./.npm-candidate/fsusui-npm-candidate.manifest.json').artifact.sha256")"
          test "${digest}" = "${{ needs.quality.outputs.npm-candidate-digest }}"
          candidate_group="$(pnpm --silent release:concurrency:plan \
            --package '${{ needs.plan.outputs.package }}' \
            --version '${{ needs.plan.outputs.version }}' \
            --candidate-manifest .npm-candidate/fsusui-npm-candidate.manifest.json)"
          test "${candidate_group}" = "${{ needs.plan.outputs.concurrency-group }}"
      - name: Verify stable release against the #318 receipt
        if: needs.plan.outputs.dist-tag == 'latest'
        run: |
          test -s .cross-gate/fsusblog-consumer-gate.receipt.sha256
          cross_gate_digest='${{ needs.fsusblog-consumer.outputs.receipt-sha256 }}'
          test "$cross_gate_digest" = "$(awk '{ print $1 }' .cross-gate/fsusblog-consumer-gate.receipt.sha256)"
          node scripts/fsusui-release-dispatch.mjs verify \
            --candidate .npm-candidate/fsusui-npm-candidate.tgz \
            --candidate-manifest .npm-candidate/fsusui-npm-candidate.manifest.json \
            --cross-gate-receipt .cross-gate/fsusblog-consumer-gate.receipt.json \
            --cross-gate-receipt-sha256 "$cross_gate_digest" \
            --source-commit "$GITHUB_SHA" \
            --release-tag "$GITHUB_REF_NAME"
      - name: Read npm channel state after lock
        id: npm_state
        run: |
          node scripts/npm-channel-state.mjs \
            --package '${{ needs.plan.outputs.package }}' \
            --candidate '${{ needs.plan.outputs.version }}' \
            --channel '${{ needs.plan.outputs.dist-tag }}' \
            --github-output
      - name: Check channel monotonicity after lock
        id: monotonicity
        run: |
          pnpm release:channel:check \
            --candidate '${{ needs.plan.outputs.version }}' \
            --current '${{ steps.npm_state.outputs.current }}' \
            --candidate-exists '${{ steps.npm_state.outputs.candidate_exists }}' \
            --github-output
      - name: Publish to npm
        id: publish
        if: steps.monotonicity.outputs.action == 'publish'
        run: |
          npm publish ./.npm-candidate/fsusui-npm-candidate.tgz --access public --tag '${{ needs.plan.outputs.dist-tag }}'
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Verify stable npm publication and dispatch the release event
        if: steps.publish.outputs.published == 'true' && needs.plan.outputs.dist-tag == 'latest'
        env:
          FSUS_RELEASE_TRAIN_APP_ID: ${{ vars.FSUS_RELEASE_TRAIN_APP_ID }}
          FSUS_RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.FSUS_RELEASE_TRAIN_APP_PRIVATE_KEY }}
        run: |
          cross_gate_digest='${{ needs.fsusblog-consumer.outputs.receipt-sha256 }}'
          node scripts/fsusui-release-dispatch.mjs dispatch \
            --candidate .npm-candidate/fsusui-npm-candidate.tgz \
            --candidate-manifest .npm-candidate/fsusui-npm-candidate.manifest.json \
            --cross-gate-receipt .cross-gate/fsusblog-consumer-gate.receipt.json \
            --cross-gate-receipt-sha256 "$cross_gate_digest" \
            --source-commit "$GITHUB_SHA" \
            --release-tag "$GITHUB_REF_NAME" \
            --dist-tag '${{ needs.plan.outputs.dist-tag }}' \
            --publish-run-id "$GITHUB_RUN_ID" \
            --npm-tarball-out .release-dispatch/npm-published.tgz \
            --receipt-out .release-dispatch/fsusui-release-dispatch.receipt.json
      - name: Upload sanitized release dispatch receipt
        if: steps.publish.outputs.published == 'true' && needs.plan.outputs.dist-tag == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: fsusui-release-dispatch-${{ github.run_id }}
          path: .release-dispatch/fsusui-release-dispatch.receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Report skipped publish
        if: steps.monotonicity.outputs.action == 'skip'
        run: |
          echo "${{ needs.plan.outputs.package }}@${{ needs.plan.outputs.version }} already owns ${{ needs.plan.outputs.dist-tag }}. No publish was attempted."
          echo "Verified candidate digest: ${{ needs.quality.outputs.npm-candidate-digest }}"
