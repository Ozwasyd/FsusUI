name: Publish npm Package

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      group: release

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Use npm 11.5.1+
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - uses: actions/download-artifact@v4
        with:
          name: fsusui-npm-candidate
          path: .npm-candidate

      - name: Verify tested npm candidate
        run: |
          pnpm run package:candidate:verify -- --tarball .npm-candidate/fsusui-npm-candidate.tgz --tag-version "${GITHUB_REF_NAME}"
          digest="$(node -p "require('./.npm-candidate/fsusui-npm-candidate.manifest.json').artifact.sha256")"
          test "${digest}" = "${{ needs.quality.outputs.npm-candidate-digest }}"

      - name: Resolve package metadata
        id: package
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          manifest_json=".npm-candidate/fsusui-npm-candidate.manifest.json"
          name="$(node -p "require('./${manifest_json}').package.name")"
          version="$(node -p "require('./${manifest_json}').package.version")"

          if [ "${tag_version}" != "${version}" ]; then
            echo "Tag version ${tag_version} does not match candidate version ${version}." >&2
            exit 1
          fi

          dist_tag="$(node ./scripts/resolve-npm-dist-tag.mjs "${version}")"

          {
            echo "name=${name}"
            echo "version=${version}"
            echo "dist_tag=${dist_tag}"
          } >> "${GITHUB_OUTPUT}"

          echo "Publishing ${name}@${version} with dist-tag ${dist_tag}."

      - name: Check npm version availability
        id: npm_view
        run: |
          set -euo pipefail
          package_spec="${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}"

          set +e
          view_output="$(npm view "${package_spec}" version --registry=https://registry.npmjs.org/ 2>&1)"
          view_status=$?
          set -e

          if [ "${view_status}" -eq 0 ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${package_spec} already exists on npm as ${view_output}. Skipping publish."
            exit 0
          fi

          if echo "${view_output}" | grep -Eq 'E404|404 Not Found'; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "${package_spec} does not exist on npm yet."
            exit 0
          fi

          echo "${view_output}" >&2
          exit "${view_status}"

      - name: Publish to npm
        if: steps.npm_view.outputs.exists != 'true'
        run: npm publish ./.npm-candidate/fsusui-npm-candidate.tgz --access public --tag "${{ steps.package.outputs.dist_tag }}"

      - name: Report skipped publish
        if: steps.npm_view.outputs.exists == 'true'
        run: |
          echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} already exists on npm. No publish was attempted."
          echo "Verified candidate digest: ${{ needs.quality.outputs.npm-candidate-digest }}"
