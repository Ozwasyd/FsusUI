name: Publish npm Package

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      package: ${{ steps.plan.outputs.package }}
      version: ${{ steps.plan.outputs.version }}
      dist-tag: ${{ steps.plan.outputs.dist_tag }}
      concurrency-group: ${{ steps.plan.outputs.concurrency_group }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Resolve canonical release resource
        id: plan
        run: |
          node ./scripts/release-concurrency-plan.mjs \
            --package @ozwasyd/element-plus \
            --version "${GITHUB_REF_NAME#v}" \
            --github-output

  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      group: release
      release_tag: ${{ github.ref_name }}

  quality-playwright:
    uses: ./.github/workflows/_quality-playwright.yml
    with:
      group: release

  quality-readiness:
    if: always()
    needs: [quality, quality-playwright]
    uses: ./.github/workflows/_quality-readiness.yml
    with:
      group: release
      playwright_group: release
      release_tag: ${{ github.ref_name }}

  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, quality-readiness, plan]
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      needs.quality-readiness.result == 'success' &&
      needs.plan.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com/
          scope: '@ozwasyd'
      - uses: actions/download-artifact@v4
        with:
          name: fsusui-npm-candidate
          path: .npm-candidate
      - name: Verify candidate and release plan before lock
        run: |
          test -n "${{ needs.quality-readiness.outputs.release-readiness-digest }}"
          pnpm run package:candidate:verify -- --tarball .npm-candidate/fsusui-npm-candidate.tgz --tag-version "${GITHUB_REF_NAME}"
          digest="$(node -p "require('./.npm-candidate/fsusui-npm-candidate.manifest.json').artifact.sha256")"
          test "${digest}" = "${{ needs.quality.outputs.npm-candidate-digest }}"
          candidate_group="$(pnpm --silent release:concurrency:plan \
            --package '${{ needs.plan.outputs.package }}' \
            --version '${{ needs.plan.outputs.version }}' \
            --candidate-manifest .npm-candidate/fsusui-npm-candidate.manifest.json)"
          test "${candidate_group}" = "${{ needs.plan.outputs.concurrency-group }}"
      - name: Read npm channel state before lock
        id: npm_state
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/npm-channel-state.mjs \
            --package '${{ needs.plan.outputs.package }}' \
            --candidate '${{ needs.plan.outputs.version }}' \
            --channel '${{ needs.plan.outputs.dist-tag }}' \
            --github-output
      - name: Check channel monotonicity before lock
        run: |
          pnpm release:channel:check \
            --candidate '${{ needs.plan.outputs.version }}' \
            --current '${{ steps.npm_state.outputs.current }}' \
            --candidate-exists '${{ steps.npm_state.outputs.candidate_exists }}'

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, quality-readiness, plan, preflight]
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      needs.quality-readiness.result == 'success' &&
      needs.plan.result == 'success' &&
      needs.preflight.result == 'success'
    concurrency:
      group: ${{ needs.plan.outputs.concurrency-group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com/
          scope: '@ozwasyd'
      - name: Use npm 11.5.1+
        run: |
          npm install -g npm@^11.5.1 --registry=https://registry.npmjs.org/
          npm --version
      - uses: actions/download-artifact@v4
        with:
          name: fsusui-npm-candidate
          path: .npm-candidate
      - name: Verify locked candidate identity
        run: |
          test -n "${{ needs.quality-readiness.outputs.release-readiness-digest }}"
          pnpm run package:candidate:verify -- --tarball .npm-candidate/fsusui-npm-candidate.tgz --tag-version "${GITHUB_REF_NAME}"
          digest="$(node -p "require('./.npm-candidate/fsusui-npm-candidate.manifest.json').artifact.sha256")"
          test "${digest}" = "${{ needs.quality.outputs.npm-candidate-digest }}"
          candidate_group="$(pnpm --silent release:concurrency:plan \
            --package '${{ needs.plan.outputs.package }}' \
            --version '${{ needs.plan.outputs.version }}' \
            --candidate-manifest .npm-candidate/fsusui-npm-candidate.manifest.json)"
          test "${candidate_group}" = "${{ needs.plan.outputs.concurrency-group }}"
      - name: Read npm channel state after lock
        id: npm_state
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/npm-channel-state.mjs \
            --package '${{ needs.plan.outputs.package }}' \
            --candidate '${{ needs.plan.outputs.version }}' \
            --channel '${{ needs.plan.outputs.dist-tag }}' \
            --github-output
      - name: Check channel monotonicity after lock
        id: monotonicity
        run: |
          pnpm release:channel:check \
            --candidate '${{ needs.plan.outputs.version }}' \
            --current '${{ steps.npm_state.outputs.current }}' \
            --candidate-exists '${{ steps.npm_state.outputs.candidate_exists }}' \
            --github-output
      - name: Publish to npm
        id: publish
        if: steps.monotonicity.outputs.action == 'publish'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish ./.npm-candidate/fsusui-npm-candidate.tgz --access public --tag '${{ needs.plan.outputs.dist-tag }}' --registry=https://npm.pkg.github.com/
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Report skipped publish
        if: steps.monotonicity.outputs.action == 'skip'
        run: |
          echo "${{ needs.plan.outputs.package }}@${{ needs.plan.outputs.version }} already owns ${{ needs.plan.outputs.dist-tag }}. No publish was attempted."
          echo "Verified candidate digest: ${{ needs.quality.outputs.npm-candidate-digest }}"

  verify-published-consumer-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plan, publish]
    if: always() && needs.plan.result == 'success' && needs.publish.result == 'success'
    permissions:
      contents: read
      packages: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com/
          scope: '@ozwasyd'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: .tmp/playwright-browsers
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify published package metadata and run standalone consumer contracts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .consumer-contracts
          npm view "${{ needs.plan.outputs.package }}@${{ needs.plan.outputs.version }}" version dist.tarball dist.integrity --registry=https://npm.pkg.github.com/ --json | tee .consumer-contracts/npm-view.json
          node tests/consumer-contracts/run-consumer-contracts.mjs \
            --mode published \
            --version "${{ needs.plan.outputs.version }}" \
            --report-out .consumer-contracts/published-evidence.json
      - name: Upload published consumer contracts evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-consumer-contracts-evidence
          path: .consumer-contracts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
