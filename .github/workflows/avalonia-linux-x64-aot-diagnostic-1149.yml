name: Avalonia Linux x64 SDK servicing verification 1149

on:
  push:
    branches: [codex/avalonia-linux-x64-aot-diagnostic-1149]

permissions:
  contents: read
  actions: read

jobs:
  avalonia-linux-x64-native-aot-diagnostic:
    if: github.repository == 'Ozwasyd/FsusUI' && github.ref == 'refs/heads/codex/avalonia-linux-x64-aot-diagnostic-1149'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_COMMIT_SHA: 0b2ddaa4d85a4ad576f80faf78752baef87cc15d
      EXPECTED_CANDIDATE_DIGEST: 91dfeee605d60622dfdcc721e57dbe3435c7b5851474511a7ea417d35808dc1a
      FSUSUI_AOT_CANDIDATE_ROOT: ${{ github.workspace }}/.dotnet-candidate/nuget
      FSUSUI_AOT_CANDIDATE_MANIFEST: ${{ github.workspace }}/.dotnet-candidate/package/manifest.json
      FSUSUI_AOT_EVIDENCE_OUT: ${{ github.workspace }}/.avalonia-aot-leaf/linux-x64
    steps:
      - name: Initialize isolated directories
        run: |
          printf 'NUGET_PACKAGES=%s/fsus-aot1149/nuget\nFSUSUI_AOT_TMPDIR=%s/fsus-aot1149\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: 0b2ddaa4d85a4ad576f80faf78752baef87cc15d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '14601078929'
          merge-multiple: true
          run-id: '44673608631'
          repository: Ozwasyd/FsusUI
          github-token: ${{ github.token }}
          path: .dotnet-candidate
      - name: Validate immutable package and restore canonical alignment
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { mkdirSync, readFileSync, readdirSync, writeFileSync } from 'node:fs'
          import {
            currentIdentity, readStableConsumerAuthority, validatePackageAlignmentBinding,
          } from './scripts/avalonia-stable-readiness-lib.mjs'
          const commit = process.env.EXPECTED_COMMIT_SHA
          const digest = process.env.EXPECTED_CANDIDATE_DIGEST
          assert.match(commit, /^[0-9a-f]{40}$/u)
          assert.match(digest, /^[0-9a-f]{64}$/u)
          const expected = currentIdentity({ requireCleanPackageInputs: true })
          assert.equal(expected.candidate, commit)
          const manifest = JSON.parse(readFileSync('.dotnet-candidate/package/manifest.json'))
          assert.equal(manifest.kind, 'dotnet-package-candidate')
          assert.equal(manifest.commitSha, commit)
          assert.equal(manifest.candidateSha256, digest)
          const feed = '.dotnet-candidate/nuget'
          assert.equal(manifest.packages.length, 6)
          assert.deepEqual(readdirSync(feed).sort(), manifest.packages.map(item => item.file).sort())
          const packageDigest = createHash('sha256')
          for (const item of manifest.packages) {
            assert.match(item.file, /^FsusUI\.Avalonia(?:\.Icons|\.Themes)?\.[0-9A-Za-z.-]+\.s?nupkg$/u)
            const bytes = readFileSync(feed + '/' + item.file)
            const hash = createHash('sha256').update(bytes).digest('hex')
            assert.equal(bytes.length, item.bytes)
            assert.equal(hash, item.sha256)
            packageDigest.update(item.file + '\0' + hash + '\n')
          }
          assert.equal(packageDigest.digest('hex'), digest)
          const source = '.dotnet-candidate/package/contract-v2-alignment.json'
          const bytes = readFileSync(source)
          validatePackageAlignmentBinding(manifest.contractV2Alignment, bytes, { candidate: commit })
          readStableConsumerAuthority({ alignmentPath: source, expected })
          mkdirSync('.tmp/conformance-v2', { recursive: true })
          writeFileSync('.tmp/conformance-v2/alignment.json', bytes, { flag: 'wx' })
          JS
      - name: Warm dependency cache for the exact consumer fixture
        timeout-minutes: 8
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$NUGET_PACKAGES" "$FSUSUI_AOT_TMPDIR/warmup"
          printf '%s\n' '{"sdk":{"version":"10.0.404","rollForward":"disable"}}' > "$FSUSUI_AOT_TMPDIR/global.json"
          cp tests/fixtures/avalonia-aot-smoke/FsusUI.Avalonia.AotSmoke.csproj "$FSUSUI_AOT_TMPDIR/warmup/"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          root = ET.Element('configuration')
          sources = ET.SubElement(root, 'packageSources')
          ET.SubElement(sources, 'clear')
          ET.SubElement(sources, 'add', key='candidate', value=os.environ['FSUSUI_AOT_CANDIDATE_ROOT'])
          ET.SubElement(sources, 'add', key='nuget.org', value='https://api.nuget.org/v3/index.json')
          mappings = ET.SubElement(root, 'packageSourceMapping')
          local = ET.SubElement(mappings, 'packageSource', key='candidate')
          for package in ('FsusUI.Avalonia', 'FsusUI.Avalonia.Icons', 'FsusUI.Avalonia.Themes'):
              ET.SubElement(local, 'package', pattern=package)
          ET.SubElement(ET.SubElement(mappings, 'packageSource', key='nuget.org'), 'package', pattern='*')
          ET.ElementTree(root).write(Path(os.environ['FSUSUI_AOT_TMPDIR']) / 'warmup' / 'NuGet.Config', encoding='utf-8')
          PY
          cd "$FSUSUI_AOT_TMPDIR/warmup"
          test "$(dotnet --version)" = 10.0.404
          dotnet restore FsusUI.Avalonia.AotSmoke.csproj \
            --runtime linux-x64 -p:UseRidGraph=true \
            --configfile NuGet.Config --packages "$NUGET_PACKAGES" -p:WarningsAsErrors=NU1903
          python3 - <<'PY'
          import json
          with open('obj/project.assets.json') as f:
              libraries = json.load(f)['libraries']
          compiler = sorted(k for k in libraries if k.lower().startswith('microsoft.dotnet.ilcompiler/'))
          assert compiler == ['Microsoft.DotNet.ILCompiler/10.0.15'], compiler
          print('Verified Native AOT compiler: ' + compiler[0])
          PY
      - name: Regenerate and verify repository locks using serviced SDK
        working-directory: dotnet
        timeout-minutes: 9
        env:
          WarningsAsErrors: NU1903
        run: |
          cp "$FSUSUI_AOT_TMPDIR/global.json" global.json
          test "$(dotnet --version)" = 10.0.404
          dotnet restore FsusUI.Avalonia.slnx --force-evaluate -p:RestoreLockedMode=false -p:WarningsAsErrors=NU1903
          node ../scripts/dotnet-restore-all.mjs --update-locks
          node ../scripts/dotnet-restore-all.mjs --locked-mode
          git diff --binary -- ':(glob)**/packages.lock.json' > "$RUNNER_TEMP/sdk-10.0.404-locks.patch"
          test -s "$RUNNER_TEMP/sdk-10.0.404-locks.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: avalonia-sdk-10.0.404-locks-1149
          path: ${{ runner.temp }}/sdk-10.0.404-locks.patch
          if-no-files-found: error
          retention-days: 7
