name: Avalonia Linux x64 locked Native AOT verification 1149

on:
  push:
    branches: [codex/avalonia-linux-x64-aot-diagnostic-1149]

permissions:
  contents: read
  actions: read

jobs:
  avalonia-linux-x64-native-aot-diagnostic:
    if: github.repository == 'Ozwasyd/FsusUI' && github.ref == 'refs/heads/codex/avalonia-linux-x64-aot-diagnostic-1149'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_COMMIT_SHA: 0b2ddaa4d85a4ad576f80faf78752baef87cc15d
      EXPECTED_CANDIDATE_DIGEST: 91dfeee605d60622dfdcc721e57dbe3435c7b5851474511a7ea417d35808dc1a
      FSUSUI_AOT_CANDIDATE_ROOT: ${{ github.workspace }}/.dotnet-candidate/nuget
      FSUSUI_AOT_CANDIDATE_MANIFEST: ${{ github.workspace }}/.dotnet-candidate/package/manifest.json
      FSUSUI_AOT_EVIDENCE_OUT: ${{ github.workspace }}/.avalonia-aot-leaf/linux-x64
    steps:
      - name: Initialize isolated directories
        run: |
          printf 'NUGET_PACKAGES=%s/fsus-aot1149/nuget\nFSUSUI_AOT_TMPDIR=%s/fsus-aot1149\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: 0b2ddaa4d85a4ad576f80faf78752baef87cc15d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '14601078929'
          merge-multiple: true
          run-id: '44673608631'
          repository: Ozwasyd/FsusUI
          github-token: ${{ github.token }}
          path: .dotnet-candidate
      - name: Validate immutable package and restore canonical alignment
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { mkdirSync, readFileSync, readdirSync, writeFileSync } from 'node:fs'
          import {
            currentIdentity, readStableConsumerAuthority, validatePackageAlignmentBinding,
          } from './scripts/avalonia-stable-readiness-lib.mjs'
          const commit = process.env.EXPECTED_COMMIT_SHA
          const digest = process.env.EXPECTED_CANDIDATE_DIGEST
          assert.match(commit, /^[0-9a-f]{40}$/u)
          assert.match(digest, /^[0-9a-f]{64}$/u)
          const expected = currentIdentity({ requireCleanPackageInputs: true })
          assert.equal(expected.candidate, commit)
          const manifest = JSON.parse(readFileSync('.dotnet-candidate/package/manifest.json'))
          assert.equal(manifest.kind, 'dotnet-package-candidate')
          assert.equal(manifest.commitSha, commit)
          assert.equal(manifest.candidateSha256, digest)
          const feed = '.dotnet-candidate/nuget'
          assert.equal(manifest.packages.length, 6)
          assert.deepEqual(readdirSync(feed).sort(), manifest.packages.map(item => item.file).sort())
          const packageDigest = createHash('sha256')
          for (const item of manifest.packages) {
            assert.match(item.file, /^FsusUI\.Avalonia(?:\.Icons|\.Themes)?\.[0-9A-Za-z.-]+\.s?nupkg$/u)
            const bytes = readFileSync(feed + '/' + item.file)
            const hash = createHash('sha256').update(bytes).digest('hex')
            assert.equal(bytes.length, item.bytes)
            assert.equal(hash, item.sha256)
            packageDigest.update(item.file + '\0' + hash + '\n')
          }
          assert.equal(packageDigest.digest('hex'), digest)
          const source = '.dotnet-candidate/package/contract-v2-alignment.json'
          const bytes = readFileSync(source)
          validatePackageAlignmentBinding(manifest.contractV2Alignment, bytes, { candidate: commit })
          readStableConsumerAuthority({ alignmentPath: source, expected })
          mkdirSync('.tmp/conformance-v2', { recursive: true })
          writeFileSync('.tmp/conformance-v2/alignment.json', bytes, { flag: 'wx' })
          JS
      - name: Install hosted Linux Native AOT prerequisites
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev xvfb xauth x11-utils dbus-daemon dbus-bin at-spi2-core
          test -x /usr/bin/xdpyinfo
          test -x /usr/bin/dbus-daemon
          xvfb-run -a -e /dev/stderr -s '-screen 0 1024x768x24 -nolisten tcp' \
            /usr/bin/dbus-run-session -- bash -euc '
              timeout 10s /usr/bin/xdpyinfo -display "$DISPLAY" >/dev/null
              reply="$(timeout 10s /usr/bin/dbus-send --session --print-reply=literal \
                --dest=org.a11y.Bus /org/a11y/bus org.a11y.Bus.GetAddress)"
              address="$(printf "%s" "$reply" | sed -E "s/^[[:space:]]+//; s/[[:space:]]+$//")"
              [[ "$address" == unix:* ]]
              timeout 10s /usr/bin/dbus-send --bus="$address" --print-reply \
                --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.ListNames >/dev/null
              echo "AT-SPI session activation and accessibility bus verified"
            '
      - name: Warm dependency cache for the exact consumer fixture
        timeout-minutes: 8
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$NUGET_PACKAGES" "$FSUSUI_AOT_TMPDIR/warmup"
          printf '%s\n' '{"sdk":{"version":"10.0.404","rollForward":"disable"}}' > "$FSUSUI_AOT_TMPDIR/global.json"
          cp tests/fixtures/avalonia-aot-smoke/FsusUI.Avalonia.AotSmoke.csproj "$FSUSUI_AOT_TMPDIR/warmup/"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          root = ET.Element('configuration')
          sources = ET.SubElement(root, 'packageSources')
          ET.SubElement(sources, 'clear')
          ET.SubElement(sources, 'add', key='candidate', value=os.environ['FSUSUI_AOT_CANDIDATE_ROOT'])
          ET.SubElement(sources, 'add', key='nuget.org', value='https://api.nuget.org/v3/index.json')
          mappings = ET.SubElement(root, 'packageSourceMapping')
          local = ET.SubElement(mappings, 'packageSource', key='candidate')
          for package in ('FsusUI.Avalonia', 'FsusUI.Avalonia.Icons', 'FsusUI.Avalonia.Themes'):
              ET.SubElement(local, 'package', pattern=package)
          ET.SubElement(ET.SubElement(mappings, 'packageSource', key='nuget.org'), 'package', pattern='*')
          ET.ElementTree(root).write(Path(os.environ['FSUSUI_AOT_TMPDIR']) / 'warmup' / 'NuGet.Config', encoding='utf-8')
          PY
          cd "$FSUSUI_AOT_TMPDIR/warmup"
          test "$(dotnet --version)" = 10.0.404
          dotnet restore FsusUI.Avalonia.AotSmoke.csproj \
            --runtime linux-x64 -p:UseRidGraph=true \
            --configfile NuGet.Config --packages "$NUGET_PACKAGES" --use-lock-file -p:WarningsAsErrors=NU1903
          test -s packages.lock.json
          printf 'FSUSUI_AOT_DEPENDENCY_LOCK=%s/warmup/packages.lock.json\n' "$FSUSUI_AOT_TMPDIR" >> "$GITHUB_ENV"
      - name: Apply proposed harness changes only to historical checkout
        run: |
          patch --fuzz=0 -p1 <<'DIAGNOSTIC_PATCH'
          diff --git a/scripts/test-avalonia-aot-smoke.mjs b/scripts/test-avalonia-aot-smoke.mjs
          index 28530e9..7aae508 100644
          --- a/scripts/test-avalonia-aot-smoke.mjs
          +++ b/scripts/test-avalonia-aot-smoke.mjs
          @@ -60,6 +60,14 @@ const reportPath = path.join(temporaryRoot, 'reports/smoke.json')
           const leafManifestPath = path.join(temporaryRoot, 'reports/leaf-manifest.json')
           const missingDotnetRoot = path.join(temporaryRoot, 'no-dotnet-runtime')
           const dotnetInfo = spawnSync('dotnet', ['--info'], { encoding: 'utf8' })
          +const sdkVersion = spawnSync('dotnet', ['--version'], { encoding: 'utf8' })
          +assert.equal(sdkVersion.status, 0, sdkVersion.stderr)
          +assert.match(sdkVersion.stdout.trim(), /^\d+\.\d+\.\d+$/u)
          +writeFileSync(
          +  path.join(temporaryRoot, 'global.json'),
          +  JSON.stringify({ sdk: { version: sdkVersion.stdout.trim(), rollForward: 'disable' } }),
          +  { flag: 'wx' },
          +)
           const rid = dotnetInfo.stdout.match(/^\s*RID:\s*(\S+)\s*$/mu)?.[1]
           const commitSha = spawnSync('git', ['rev-parse', 'HEAD'], {
             cwd: root,
          @@ -115,13 +123,14 @@ const execute = (command, arguments_, options = {}) => {
             return result
           }
           
          -const globalPackagesOutput = execute(
          -  'dotnet',
          -  ['nuget', 'locals', 'global-packages', '--list'],
          -  { label: 'resolve global NuGet cache' },
          -).stdout.trim()
          +const prewarmedPackages = process.env.NUGET_PACKAGES
           const globalPackages = realpathSync(
          -  globalPackagesOutput.slice(globalPackagesOutput.indexOf(':') + 1).trim(),
          +  prewarmedPackages
          +    ? path.resolve(prewarmedPackages)
          +    : execute('dotnet', ['nuget', 'locals', 'global-packages', '--list'], {
          +        cwd: temporaryRoot,
          +        label: 'resolve global NuGet cache',
          +      }).stdout.trim().replace(/^[^:]+:\s*/u, ''),
           )
           const candidatePackagePattern =
             /^fsusui\.avalonia(?:\.themes|\.icons)?\..*\.nupkg$/iu
          @@ -367,7 +376,18 @@ if (suppliedManifest) {
           cpSync(fixture, consumer, { recursive: true })
           writeFileSync(path.join(consumer, 'NuGet.Config'), configFor(feed))
           const consumerProject = path.join(consumer, 'FsusUI.Avalonia.AotSmoke.csproj')
          -const publish = execute(
          +const dependencyLock = process.env.FSUSUI_AOT_DEPENDENCY_LOCK
          +if (dependencyLock) {
          +  assert.ok(
          +    suppliedCandidateRoot && suppliedManifest,
          +    'dependency lock requires an immutable supplied candidate',
          +  )
          +  copyFileSync(
          +    path.resolve(dependencyLock),
          +    path.join(consumer, 'packages.lock.json'),
          +  )
          +}
          +execute(
             isolatedDotnet,
             [
               'restore',
          @@ -379,6 +399,7 @@ const publish = execute(
               path.join(consumer, 'NuGet.Config'),
               '--packages',
               consumerPackages,
          +    ...(dependencyLock ? ['--locked-mode'] : []),
               '--no-cache',
               '--force',
             ],
          @@ -387,12 +408,7 @@ const publish = execute(
               label: 'isolated local-only consumer restore no-external-sources',
             },
           )
          -assert.doesNotMatch(
          -  `${publish.stdout}\n${publish.stderr}`,
          -  /warning\s+(?:IL\d+|AOT\d+|trim)/iu,
          -  'Native AOT publish must not emit IL/AOT/trim warnings',
          -)
          -execute(
          +const publish = execute(
             isolatedDotnet,
             [
               'publish',
          @@ -412,6 +428,11 @@ execute(
               label: `Native AOT publish ${rid}`,
             },
           )
          +assert.doesNotMatch(
          +  `${publish.stdout}\n${publish.stderr}`,
          +  /warning\s+(?:IL\d+|AOT\d+|trim)/iu,
          +  'Native AOT publish must not emit IL/AOT/trim warnings',
          +)
           
           const nativeBinary = path.join(publishRoot, 'FsusUI.Avalonia.AotSmoke')
           assert.ok(
          @@ -466,7 +487,16 @@ assert.ok(ready, `Xvfb ${display} did not become ready`)
           const sessionBus = execute(
             '/usr/bin/dbus-daemon',
             ['--session', '--fork', '--print-address=1', '--print-pid=1'],
          -  { label: 'start isolated desktop session bus' },
          +  {
          +    env: {
          +      ...process.env,
          +      DISPLAY: display,
          +      ...(inheritedDisplayReady && process.env.XAUTHORITY
          +        ? { XAUTHORITY: process.env.XAUTHORITY }
          +        : {}),
          +    },
          +    label: 'start isolated desktop session bus',
          +  },
           )
             .stdout.trim()
             .split('\n')
          @@ -579,6 +609,25 @@ const stopProcessId = async (pid, label) => {
           }
           
           try {
          +  if (dependencyLock) {
          +    const accessibilityBus = execute(
          +      '/usr/bin/dbus-send',
          +      [
          +        `--bus=${sessionBusAddress}`,
          +        '--reply-timeout=5000',
          +        '--print-reply=literal',
          +        '--dest=org.a11y.Bus',
          +        '/org/a11y/bus',
          +        'org.a11y.Bus.GetAddress',
          +      ],
          +      { label: 'resolve AT-SPI on the isolated session bus', timeout: 7000 },
          +    ).stdout.trim()
          +    assert.match(
          +      accessibilityBus,
          +      /^unix:/u,
          +      'the isolated session returned no usable AT-SPI bus address',
          +    )
          +  }
             const positive = execute(nativeBinary, smokeArguments(reportPath), {
               cwd: temporaryRoot,
               env: runtimeFreeEnvironment,
          @@ -701,6 +750,7 @@ try {
                 '--force',
               ],
               {
          +      cwd: consumer,
                 expectFailure: true,
                 label: 'missing local FsusUI package',
                 timeout: negativeControlTimeout,
          DIAGNOSTIC_PATCH
      - name: Run exact proposed locked Native AOT smoke and negative controls
        timeout-minutes: 18
        working-directory: ${{ runner.temp }}/fsus-aot1149
        env:
          FSUSUI_KEEP_AOT_SMOKE: '1'
          FSUSUI_AOT_DIAGNOSTIC: '1'
        run: |
          test "$(dotnet --version)" = 10.0.404
          xvfb-run -a -e /dev/stderr -s '-screen 0 1024x768x24 -nolisten tcp' \
            bash -euc 'timeout 10s /usr/bin/xdpyinfo -display "$DISPLAY" >/dev/null; exec node "$GITHUB_WORKSPACE/scripts/test-avalonia-aot-smoke.mjs"'
      - name: Collect failed native report
        if: failure()
        run: |
          shopt -s nullglob
          reports=("$FSUSUI_AOT_TMPDIR"/fsusui-native-aot-*/reports/smoke.json)
          if (( ${#reports[@]} == 0 )); then
            echo "::warning::Native fixture did not write a smoke report."
            exit 0
          fi
          test "${#reports[@]}" -eq 1
          test -f "${reports[0]}" && test ! -L "${reports[0]}"
          mkdir -p "$RUNNER_TEMP/fsus-aot1149-failure"
          cp -- "${reports[0]}" "$RUNNER_TEMP/fsus-aot1149-failure/smoke.json"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: avalonia-linux-x64-aot-failure-report-1149
          path: ${{ runner.temp }}/fsus-aot1149-failure/smoke.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate exact native leaf identity
        run: >-
          node scripts/avalonia-aot-native.mjs validate-leaf
          --manifest .avalonia-aot-leaf/linux-x64/leaf-manifest.json
          --commit-sha "$EXPECTED_COMMIT_SHA"
          --candidate-digest "$EXPECTED_CANDIDATE_DIGEST"
          --rid linux-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avalonia-linux-x64-aot-diagnostic-1149
          path: .avalonia-aot-leaf/linux-x64
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
