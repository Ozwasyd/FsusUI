name: Apply CI artifact preparation fix

on:
  push:
    branches:
      - agent/fix-ci-artifact-preparation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ci-artifact-preparation
          fetch-depth: 0
      - name: Apply verified CI patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected fragment missing from {path}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'vue/eslint.config.mjs',
              "      '**/node_modules/**',\n",
              "      '**/node_modules/**',\n      '**/emsdk-cache/**',\n",
          )
          replace_once(
              '.gitignore',
              ".eslintcache\n",
              ".eslintcache\n/emsdk-cache/\n",
          )
          replace_once(
              'package.json',
              '    "verify:pr-fast": "run-s prepare:test-artifacts _verify:pr-fast:parallel",\n',
              '    "verify:pr-fast": "run-s prepare:test-artifacts build:theme _verify:pr-fast:parallel",\n',
          )
          replace_once(
              '.github/workflows/quality.yml',
              """          cache-dependency-path: |
            current/pnpm-lock.yaml
            baseline/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
""",
              """          cache-dependency-path: |
            current/pnpm-lock.yaml
            baseline/pnpm-lock.yaml
      - uses: emscripten-core/setup-emsdk@v15
        if: >-
          steps.render-impact.outputs.run == 'true' &&
          steps.render-impact.outputs.scope != 'avalonia-only'
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-dotnet@v4
""",
          )
          replace_once(
              '.github/workflows/quality.yml',
              """      - name: Install baseline dependencies
        if: steps.baseline-contract.outputs.available == 'true'
        working-directory: baseline
        run: pnpm install --frozen-lockfile
      - name: Measure same-runner baseline first
""",
              """      - name: Install baseline dependencies
