name: Reusable Avalonia Native AOT leaf

on:
  workflow_call:
    inputs:
      group:
        required: true
        type: string
      candidate-artifact:
        required: true
        type: string
      candidate-digest:
        required: true
        type: string
      commit-sha:
        required: true
        type: string
      rid:
        required: true
        type: string
    outputs:
      manifest-digest:
        description: SHA-256 of the validated leaf manifest
        value: ${{ jobs.native-leaf.outputs.manifest-digest }}

jobs:
  native-leaf:
    runs-on: ${{ inputs.rid == 'linux-x64' && 'ubuntu-latest' || inputs.rid == 'win-x64' && 'windows-latest' || 'macos-15' }}
    timeout-minutes: 90
    outputs:
      manifest-digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate-artifact }}
          path: .dotnet-candidate
      - name: Validate and restore canonical Contract V2 alignment
        if: inputs.rid == 'linux-x64'
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.commit-sha }}
          EXPECTED_CANDIDATE_DIGEST: ${{ inputs.candidate-digest }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { mkdirSync, readFileSync, readdirSync, writeFileSync } from 'node:fs'
          import {
            currentIdentity,
            readStableConsumerAuthority,
            validatePackageAlignmentBinding,
          } from './scripts/avalonia-stable-readiness-lib.mjs'

          const commit = process.env.EXPECTED_COMMIT_SHA
          const digest = process.env.EXPECTED_CANDIDATE_DIGEST
          assert.match(commit, /^[0-9a-f]{40}$/u)
          assert.match(digest, /^[0-9a-f]{64}$/u)
          const expected = currentIdentity()
          assert.equal(expected.candidate, commit, 'leaf checkout does not match candidate commit')
          const manifest = JSON.parse(readFileSync('.dotnet-candidate/package/manifest.json', 'utf8'))
          assert.equal(manifest.kind, 'dotnet-package-candidate')
          assert.equal(manifest.commitSha, commit, 'downloaded candidate commit mismatch')
          assert.equal(manifest.candidateSha256, digest, 'downloaded candidate digest mismatch')

          const feed = '.dotnet-candidate/nuget'
          assert.equal(manifest.packages.length, 6)
          assert.deepEqual(readdirSync(feed).sort(), manifest.packages.map(item => item.file).sort())
          const packageDigest = createHash('sha256')
          for (const item of manifest.packages) {
            assert.match(item.file, /^FsusUI\.Avalonia(?:\.Icons|\.Themes)?\.[0-9A-Za-z.-]+\.s?nupkg$/u)
            const content = readFileSync(feed + '/' + item.file)
            const hash = createHash('sha256').update(content).digest('hex')
            assert.equal(content.length, item.bytes)
            assert.equal(hash, item.sha256)
            packageDigest.update(item.file + '\0' + hash + '\n')
          }
          assert.equal(packageDigest.digest('hex'), digest, 'downloaded candidate package bytes mismatch')

          const source = '.dotnet-candidate/package/contract-v2-alignment.json'
          const bytes = readFileSync(source)
          validatePackageAlignmentBinding(manifest.contractV2Alignment, bytes, { candidate: commit })
          readStableConsumerAuthority({ alignmentPath: source, expected })

          mkdirSync('.tmp/conformance-v2', { recursive: true })
          writeFileSync('.tmp/conformance-v2/alignment.json', bytes, { flag: 'wx' })
          console.log('[avalonia-aot] Verified and restored canonical Contract V2 alignment')
          JS
      - name: Restore Linux AOT warmup NuGet package cache
        if: inputs.rid == 'linux-x64'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/aot-warmup-packages
          key: ${{ runner.os }}-${{ runner.arch }}-fsusui-aot-nuget-${{ hashFiles('dotnet/global.json', 'tests/fixtures/avalonia-aot-smoke/FsusUI.Avalonia.AotSmoke.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fsusui-aot-nuget-${{ hashFiles('dotnet/global.json') }}-
      - name: Install Linux Native AOT prerequisites
        if: inputs.rid == 'linux-x64'
        run: |
          missing=()
          for pkg in clang zlib1g-dev xvfb xauth x11-utils dbus-daemon dbus-bin at-spi2-core; do
            dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed' || missing+=("$pkg")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${missing[@]}"
          else
            echo "[avalonia-aot] Linux Native AOT prerequisites already installed."
          fi
      - name: Resolve exact Linux AOT fixture dependencies
        if: inputs.rid == 'linux-x64'
        timeout-minutes: 8
        env:
          FSUSUI_AOT_CANDIDATE_ROOT: ${{ github.workspace }}/.dotnet-candidate/nuget
        run: |
          root="$(mktemp -d "$RUNNER_TEMP/fsusui-aot-leaf.XXXXXX")"
          nuget_cache="$HOME/.nuget/aot-warmup-packages"
          mkdir -p "$root/warmup" "$nuget_cache"
          rm -rf "$nuget_cache"/fsusui.avalonia*
          cp dotnet/global.json "$root/global.json"
          cp tests/fixtures/avalonia-aot-smoke/FsusUI.Avalonia.AotSmoke.csproj "$root/warmup/"
          cd "$root/warmup"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.Element('configuration')
          sources = ET.SubElement(root, 'packageSources')
          ET.SubElement(sources, 'clear')
          ET.SubElement(sources, 'add', key='candidate', value=os.environ['FSUSUI_AOT_CANDIDATE_ROOT'])
          ET.SubElement(sources, 'add', key='nuget.org', value='https://api.nuget.org/v3/index.json')
          mappings = ET.SubElement(root, 'packageSourceMapping')
          local = ET.SubElement(mappings, 'packageSource', key='candidate')
          for package in ('FsusUI.Avalonia', 'FsusUI.Avalonia.Icons', 'FsusUI.Avalonia.Themes'):
              ET.SubElement(local, 'package', pattern=package)
          upstream = ET.SubElement(mappings, 'packageSource', key='nuget.org')
          ET.SubElement(upstream, 'package', pattern='*')
          ET.ElementTree(root).write('NuGet.Config', encoding='utf-8')
          PY
          dotnet restore FsusUI.Avalonia.AotSmoke.csproj \
            --runtime linux-x64 -p:UseRidGraph=true \
            --configfile NuGet.Config --packages "$nuget_cache" --use-lock-file
          test -s packages.lock.json
          rm -rf "$nuget_cache"/fsusui.avalonia*
          {
            printf 'NUGET_PACKAGES=%s\n' "$nuget_cache"
            printf 'FSUSUI_AOT_TMPDIR=%s\n' "$root"
            printf 'FSUSUI_AOT_DEPENDENCY_LOCK=%s/warmup/packages.lock.json\n' "$root"
          } >> "$GITHUB_ENV"
      - name: Publish and run the final native binary
        if: inputs.rid == 'linux-x64'
        env:
          FSUSUI_AOT_CANDIDATE_ROOT: ${{ github.workspace }}/.dotnet-candidate/nuget
          FSUSUI_AOT_CANDIDATE_MANIFEST: ${{ github.workspace }}/.dotnet-candidate/package/manifest.json
          FSUSUI_AOT_EVIDENCE_OUT: ${{ github.workspace }}/.avalonia-aot-leaf/${{ inputs.rid }}
        working-directory: dotnet
        run: |
          test -s "$FSUSUI_AOT_DEPENDENCY_LOCK"
          node ../scripts/test-avalonia-aot-smoke.mjs
      - name: Validate leaf identity
        if: inputs.rid == 'linux-x64'
        run: >-
          node scripts/avalonia-aot-native.mjs validate-leaf
          --manifest .avalonia-aot-leaf/${{ inputs.rid }}/leaf-manifest.json
          --commit-sha '${{ inputs.commit-sha }}'
          --candidate-digest '${{ inputs.candidate-digest }}'
          --rid '${{ inputs.rid }}'
      - name: Record leaf manifest digest
        id: manifest
        if: inputs.rid == 'linux-x64'
        run: echo "digest=$(sha256sum '.avalonia-aot-leaf/${{ inputs.rid }}/leaf-manifest.json' | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avalonia-aot-leaf-${{ inputs.group }}-${{ inputs.rid }}
          path: .avalonia-aot-leaf/${{ inputs.rid }}
          if-no-files-found: error
          retention-days: 7
