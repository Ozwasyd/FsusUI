name: Reusable Avalonia Native AOT leaf

on:
  workflow_call:
    inputs:
      group:
        required: true
        type: string
      candidate-artifact:
        required: true
        type: string
      candidate-digest:
        required: true
        type: string
      commit-sha:
        required: true
        type: string
      rid:
        required: true
        type: string
    outputs:
      manifest-digest:
        description: SHA-256 of the validated leaf manifest
        value: ${{ jobs.native-leaf.outputs.manifest-digest }}

jobs:
  native-leaf:
    runs-on: ${{ inputs.rid == 'linux-x64' && 'ubuntu-latest' || inputs.rid == 'win-x64' && 'windows-latest' || 'macos-15' }}
    timeout-minutes: 90
    outputs:
      manifest-digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate-artifact }}
          path: .dotnet-candidate
      - name: Validate and restore canonical Contract V2 alignment
        if: inputs.rid == 'linux-x64'
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.commit-sha }}
          EXPECTED_CANDIDATE_DIGEST: ${{ inputs.candidate-digest }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          import {
            currentIdentity,
            readStableConsumerAuthority,
            validatePackageAlignmentBinding,
          } from './scripts/avalonia-stable-readiness-lib.mjs'

          const commit = process.env.EXPECTED_COMMIT_SHA
          const digest = process.env.EXPECTED_CANDIDATE_DIGEST
          assert.match(commit, /^[0-9a-f]{40}$/u)
          assert.match(digest, /^[0-9a-f]{64}$/u)
          const expected = currentIdentity()
          assert.equal(expected.candidate, commit, 'leaf checkout does not match candidate commit')
          const manifest = JSON.parse(readFileSync('.dotnet-candidate/package/manifest.json', 'utf8'))
          assert.equal(manifest.kind, 'dotnet-package-candidate')
          assert.equal(manifest.commitSha, commit, 'downloaded candidate commit mismatch')
          assert.equal(manifest.candidateSha256, digest, 'downloaded candidate digest mismatch')

          const source = '.dotnet-candidate/package/contract-v2-alignment.json'
          const bytes = readFileSync(source)
          validatePackageAlignmentBinding(manifest.contractV2Alignment, bytes, { candidate: commit })
          readStableConsumerAuthority({ alignmentPath: source, expected })

          mkdirSync('.tmp/conformance-v2', { recursive: true })
          writeFileSync('.tmp/conformance-v2/alignment.json', bytes, { flag: 'wx' })
          console.log('[avalonia-aot] Verified and restored canonical Contract V2 alignment')
          JS
      - name: Install Linux virtual display
        if: inputs.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
      - name: Publish and run the final native binary
        if: inputs.rid == 'linux-x64'
        env:
          FSUSUI_AOT_CANDIDATE_ROOT: ${{ github.workspace }}/.dotnet-candidate/nuget
          FSUSUI_AOT_CANDIDATE_MANIFEST: ${{ github.workspace }}/.dotnet-candidate/package/manifest.json
          FSUSUI_AOT_EVIDENCE_OUT: ${{ github.workspace }}/.avalonia-aot-leaf/${{ inputs.rid }}
        run: node scripts/test-avalonia-aot-smoke.mjs
      - name: Validate leaf identity
        if: inputs.rid == 'linux-x64'
        run: >-
          node scripts/avalonia-aot-native.mjs validate-leaf
          --manifest .avalonia-aot-leaf/${{ inputs.rid }}/leaf-manifest.json
          --commit-sha '${{ inputs.commit-sha }}'
          --candidate-digest '${{ inputs.candidate-digest }}'
          --rid '${{ inputs.rid }}'
      - name: Record leaf manifest digest
        id: manifest
        if: inputs.rid == 'linux-x64'
        run: echo "digest=$(sha256sum '.avalonia-aot-leaf/${{ inputs.rid }}/leaf-manifest.json' | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avalonia-aot-leaf-${{ inputs.rid }}
          path: .avalonia-aot-leaf/${{ inputs.rid }}
          if-no-files-found: error
          retention-days: 7
