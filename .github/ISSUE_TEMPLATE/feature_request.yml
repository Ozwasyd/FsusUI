name: Feature request
description: Request a public API, component, documentation, or compatibility improvement.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities in public issues. Follow SECURITY.md instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, behavior, docs, or component change.
    validations:
      required: true
  - type: textarea
    id: api_impact
    attributes:
      label: API, theme, motion, or compatibility impact
      description: Note public API, theme token, motion token, or Element Plus compatibility changes.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: evidence
    attributes:
      label: Examples or references
      description: Link use cases, screenshots, prior art, or demo code.
